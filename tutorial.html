<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>快快快樂學倉頡 - 倉頡入門與拆字指南（全書完整版）</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none;margin:0;background:#111;width:100vw;height:100vh;height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;font-family:"BiauKaiHK","DFKai-SB","標楷體","Microsoft JhengHei",serif;overflow:hidden}
.dos-screen{width:960px;height:540px;background:#005a52;position:relative;border:3px solid #808080;box-shadow:0 0 25px rgba(0,0,0,.9);display:flex;flex-direction:column;justify-content:space-between;transform-origin:center;flex-shrink:0}
.dos-header{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0}
.slop-logo{display:flex;align-items:center;justify-content:center;width:95px;height:30px}
.title-group{display:flex;align-items:center;flex:1;justify-content:center;gap:16px}
.magenta-double-line{flex:1;height:8px;border-top:3px solid #f0f;border-bottom:3px solid #f0f}
.dos-main-title{color:#ff0;font-size:30px;font-weight:bold;letter-spacing:6px;text-shadow:2px 2px #000;white-space:nowrap;padding:0 10px}
.dos-stage{flex:1;position:relative;display:flex;justify-content:center;align-items:center;padding:8px 20px;overflow:hidden}
.dos-footer{height:36px;background:#c0c0c0;border-top:2px solid #fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0;z-index:10}
.key-button{background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;font-weight:bold;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:#000080;cursor:pointer;font-family:Consolas,"Microsoft JhengHei",monospace;padding:0 12px;text-decoration:none}
.key-button:active{border-color:#404040 #fff #fff #404040;background:#a8a8a8}

.sub-window{background:#003833;border:3px double #5ff;width:100%;height:100%;padding:10px 18px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:6px 6px 0 rgba(0,0,0,.5);z-index:10}
.sub-win-title{color:#ff5;font-size:19px;font-weight:bold;border-bottom:2px solid #5ff;padding-bottom:4px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.category-badge{background:#004b45;border:1px solid #5ff;color:#ff5;font-size:12px;padding:1px 8px;margin-left:8px}

/* 教學內容捲動區 */
.tut-content{overflow-y:auto;flex:1;font-size:14px;color:#fff;line-height:1.68;margin:4px 0;padding-right:6px}
.tut-h{font-weight:bold;font-size:14.5px;margin-top:8px}
.tut-h.y{color:#ff5}.tut-h.g{color:#5f5}.tut-h.o{color:#fa5}.tut-h.c{color:#5ff}
.tut-content i{font-style:normal;font-weight:bold}
.tut-content .tr{color:#ff5}.tut-content .ky{color:#0ff}.tut-content .cd{color:#fa5}.tut-content .ch{color:#ff5}

/* 主字根＋放大彩色輔助字形展示區 */
.rad-hero-box{display:flex;align-items:stretch;background:rgba(0,0,0,.38);border:2px solid #ff0;padding:8px 14px;gap:14px;margin:2px 0 6px;border-radius:4px}
.rad-main-card{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#002220;border:2px solid #ff5;padding:4px 12px;min-width:88px;box-shadow:inset 2px 2px 5px rgba(0,0,0,.85);flex-shrink:0}
.rad-big-char{font-size:54px;color:#ff5;line-height:1.05;font-weight:bold;text-shadow:2px 2px #000}
.rad-key-tag{font-size:12px;color:#0ff;font-weight:bold;margin-top:3px;font-family:Consolas,monospace;background:#003b36;padding:1px 8px;border:1px solid #0ff}

.rad-right-panel{display:flex;flex-direction:column;justify-content:space-between;flex:1;gap:5px}
.aux-showcase-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.aux-chip{display:inline-flex;align-items:center;gap:8px;background:rgba(0,30,35,.9);border:1px solid #5ff;padding:3px 10px;border-radius:3px}
.aux-glyph{font-size:26px;font-weight:bold;line-height:1;text-shadow:1px 1px #000}
.aux-glyph.c1{color:#0ff}   /* 青色：第一輔助形 */
.aux-glyph.c2{color:#5f5}   /* 亮綠：第二輔助形 */
.aux-glyph.c3{color:#ff80ab}/* 粉紅：第三輔助形 */
.aux-desc{font-size:12px;color:#eee;line-height:1.25}
.aux-desc b{display:block;font-size:12.5px}

/* 範例表格 */
.retro-table{width:100%;border-collapse:collapse;color:#fff;font-size:13px;margin-top:4px}
.retro-table th,.retro-table td{border:1px solid #5ff;padding:3.5px 8px;text-align:center}
.retro-table th{background:#002220;color:#ff5}
.retro-table td:nth-child(3){font-family:Consolas,monospace;color:#ff5;font-weight:bold;white-space:nowrap}
.aux-pill-mini{display:inline-block;padding:1px 6px;border-radius:2px;font-weight:bold;font-size:12px;background:rgba(0,0,0,.4);white-space:nowrap}

/* 進階偏旁與香港字補充卡（置於較低位置） */
.adv-aux-box{background:rgba(0,40,65,.55);border:1px dashed #5ff;padding:6px 12px;margin-top:5px;border-radius:3px;font-size:12.5px;line-height:1.55}

/* 單行詩句框：置中、字體略大（16.5px），左右各保留約 4 字闊（4em）留白 */
.poem-line-box{font-size:16.5px;line-height:1.85;background:rgba(0,0,0,.28);padding:7px 4em;border-left:4px solid #ff5;border-right:4px solid #ff5;margin-top:4px;text-align:center;white-space:nowrap;overflow-x:auto}

/* 索引頁專用緊湊免捲動樣式 */
.idx-board{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;gap:5px;padding:2px 0;overflow:hidden}
.cat-group{background:rgba(0,0,0,.28);border:1px solid #00695c;padding:5px 10px;border-radius:3px}
.cat-header{font-size:13px;font-weight:bold;margin-bottom:4px;display:flex;justify-content:space-between;line-height:1.1}
.rad-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.rad-grid.cols-6{grid-template-columns:repeat(6,1fr)}
.rad-grid.cols-4{grid-template-columns:repeat(4,1fr)}
.rad-grid.cols-2{grid-template-columns:repeat(2,1fr);gap:8px}
.rad-card{background:#002220;border:1.5px solid #5ff;padding:3px 2px;text-align:center;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .12s;cursor:pointer}
.rad-card:hover,.rad-card:focus{background:#004d40;border-color:#ff0;outline:none}
.rad-card .rk{font-family:Consolas,monospace;font-size:12px;color:#0ff;font-weight:bold;line-height:1.05}
.rad-card .rc{font-size:21px;color:#ff5;font-weight:bold;line-height:1.15}
.rad-card .rs{font-size:10px;color:#bbb;line-height:1.05;white-space:nowrap}
.rad-card.intro-card{flex-direction:row;gap:8px;padding:5px 10px;border-color:#ff5}
.rad-card.intro-card .rc{font-size:15px;color:#ff5;line-height:1.1}

/* 引言頁與總結頁卡片 */
.cat-overview-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:5px 0}
.cat-box{background:rgba(0,0,0,.32);border:1px solid #5ff;padding:5px 10px;border-radius:3px;font-size:12px;line-height:1.45}
.cat-box b{display:block;font-size:13px;margin-bottom:2px}
.xz-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:5px}
.xz-card{background:rgba(0,25,30,.75);border:1.5px solid #ff5;padding:7px 12px;border-radius:4px;display:flex;gap:12px;align-items:flex-start}
.xz-glyph-box{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#002220;border:1.5px solid #0ff;padding:4px 10px;min-width:60px;flex-shrink:0}
.xz-glyph{font-size:34px;font-weight:bold;line-height:1.1}
.xz-key{font-family:Consolas,monospace;font-size:12px;font-weight:bold;margin-top:2px;padding:0 5px;background:#003b36}

@media(max-width:480px){.dos-screen{transform:scale(.4)}}
@media(min-width:481px)and(max-width:768px){.dos-screen{transform:scale(.6)}}
</style>
</head>
<body>
<div class="dos-screen" id="dosScreen">
  <div class="dos-header">
    <div class="slop-logo" title="SLOP 經典標誌"><svg viewBox="0 0 120 40" width="95" height="30"><ellipse cx="60" cy="20" rx="55" ry="16" fill="none" stroke="#0ff" stroke-width="2"/><text x="50%" y="62%" text-anchor="middle" fill="#f0f" font-size="20" font-weight="900" font-style="italic" font-family="Arial">SLOP</text></svg></div>
    <div class="title-group">
      <div class="magenta-double-line"></div>
      <div class="dos-main-title">快快快樂學倉頡</div>
      <div class="magenta-double-line"></div>
    </div>
  </div>

  <div class="dos-stage">
    <div class="sub-window" id="mainWin"></div>
  </div>

  <!-- 底部控制列：左下僅保留 Esc [主選單]／Esc [索引]，右半頁整合上一頁與下一頁 -->
  <div class="dos-footer">
    <div style="display:flex;gap:10px;align-items:center">
      <button type="button" class="key-button" id="btnEscIdx" style="color:#800000" title="返回總目錄索引或主程式">Esc [主選單]</button>
    </div>
    <div id="footerHint" style="font-size:12px;color:#333;flex:1;text-align:center">Esc 返回索引／主選單 ｜ ← → 切換上下頁</div>
    <div style="display:flex;gap:8px;align-items:center">
      <button type="button" class="key-button" id="btnPrevPage">◀ 上一頁</button>
      <button type="button" class="key-button" id="btnNextPage">下一頁 ▶</button>

<script>
"use strict";
const C1="#0ff", C2="#5f5", C3="#ff80ab";

/* 全書 26 頁結構化教材資料（0=引言, 1..24=A日..Y卜, 25=總結） */
const PAGES = [
  {
    type:"intro",
    badge:"第 1 / 26 頁：全書引言與鍵位總覽",
    rightTag:"標準倉頡與香港字校訂版"
  },
  {
    key:"A", rad:"日", en:"Sun", cat:"第 2 / 26 頁：哲理類字根",
    aux:[
      {g:"曰", c:C1, title:"扁日框", desc:"四面封閉中有一橫（如：曲、更、書底）"},
      {g:"門", c:C2, title:"門字框", desc:"首尾碼取日弓 AN（如：間、開、關）"},
      {g:"⺜", c:C3, title:"日形變體", desc:"局部封閉帶一橫（如：冒、冕上）"}
    ],
    slogan:`凡四面封閉且中間僅有一橫的方框，以及「<b style="color:${C2}">門</b>」字外框首碼，統一歸入 <i class="ky">A</i> 鍵。`,
    rules:[
      `<b>基本形獨立成字：</b>鍵面字「<b class="tr">日</b>」獨立出現時，只取一碼 <i class="ky">A</i>（合體字如「<b>明</b>」拆為日月 <i class="cd">AB</i>）。`,
      `<b><span style="color:${C1}">曰</span>（扁日）與 <span style="color:${C3}">⺜</span>（日形變體）：</b>寬扁的「<b style="color:${C1}">曰</b>」字（單字亦取 <i class="ky">A</i>）及「更、曲、書」中的封閉帶橫方框，皆視同日取 <i class="ky">A</i>。`,
      `<b><span style="color:${C2}">門</span>（門字框關鍵規則）：</b>「<b style="color:${C2}">門</b>」字左扇上方為「日」（<i class="ky">A</i>）、右扇最末筆為豎鉤「亅」（<i class="ky">N</i>），作外框時字首固定取兩碼 <b>日弓（<i class="cd">AN</i>）</b>！`
    ],
    examples:[
      ["基本形 日","#ff5","明","AB",`左字首「<b class="tr">日</b>」取日 (<i class="ky">A</i>)，右字身「月」取月 (<i class="ky">B</i>)，連為：日月 (<i class="cd">AB</i>)。`],
      ["基本形 日","#ff5","時","AGDI",`左字首「<b class="tr">日</b>」取日 (<i class="ky">A</i>)，右字身「寺」上土 (<i class="ky">G</i>) 下寸 (<i class="cd">DI</i>)，組為：日土木戈 (<i class="cd">AGDI</i>)。`],
      ["輔助形 曰",C1,"書","LGA",`上部聿字頭拆為中土 (<i class="cd">LG</i>)，下部扁日「<b style="color:${C1}">曰</b>」取日 (<i class="ky">A</i>)，結為：中土日 (<i class="cd">LGA</i>)。`],
      ["輔助形 門",C2,"間","ANA",`外圍「<b style="color:${C2}">門</b>」框取首尾碼日弓 (<i class="cd">AN</i>)，內部「<b class="tr">日</b>」取日 (<i class="ky">A</i>)，組為：日弓日 (<i class="cd">ANA</i>)。`]
    ],
    adv:`• <b style="color:${C1}">香港字實戰 —「啲」（<i class="cd">RHAI</i>）與「晒」（<i class="cd">AMCW</i>）</b>：港人最常用的「<b>啲</b>」（些少），左「口」取 <i class="ky">R</i>，右「的」左邊「白」拆為頂撇竹 (<i class="ky">H</i>) 加「<b class="tr">日</b>」(<i class="ky">A</i>)、右邊「勺」取尾碼戈 (<i class="ky">I</i>)，全字拆為口竹日戈 (<i class="cd">RHAI</i>)；「<b>晒</b>」（曬太陽／完成語氣）左「<b class="tr">日</b>」(<i class="ky">A</i>) 右「西」(<i class="cd">MCW</i>)，拆為日一金田 (<i class="cd">AMCW</i>)。<br>• <b style="color:${C2}">三種方框辨析</b>：內有一橫為「<b class="tr">日</b>/<b style="color:${C1}">曰</b>」(<i class="ky">A</i>)；內部全空為「<b>口</b>」(<i class="ky">R</i>)；大框包部件為「<b>囗</b>」(<i class="ky">W</i>)。`,
    rhyme:"押韻：光／方／旁，粵音 -ong 平聲",
    poem:`<i class="tr">日</i>字當頭耀萬光，<b style="color:${C2}">門</b>框扁<b style="color:${C1}">曰</b> <i class="ky">A</i> 鍵方。　<i class="tr">日</i><i class="cd">弓</i><i class="tr">日</i>「<b style="color:${C2}">間</b>」<i class="tr">日</i><i class="cd">十</i>「<b class="tr">早</b>」，<i class="tr">日</i><i class="cd">土木戈</i>「<b class="tr">時</b>」在旁。`
  },
  {
    key:"B", rad:"月", en:"Moon", cat:"第 3 / 26 頁：哲理類字根",
    aux:[
      {g:"⺼", c:C1, title:"肉月旁", desc:"人體器官偏旁（如：肌、腦、腳、骨）"},
      {g:"冂", c:C2, title:"同字框", desc:"三面框下方開口（如：同、周、冇底）"},
      {g:"目貝豸", c:C3, title:"目/貝/豸首碼", desc:"外框或起筆歸 B（如：見、財、貓、貌）"}
    ],
    slogan:`<span style="color:${C1};font-weight:bold">肉月偏旁</span>與<span style="color:${C2};font-weight:bold">下方開口的三面框</span>，以及「<span style="color:${C3};font-weight:bold">目、貝、豸</span>」部件首碼，統一歸入 <i class="ky">B</i> 鍵。`,
    rules:[
      `<b>基本形獨立成字：</b>鍵面字「<b class="tr">月</b>」獨立出現時，只取一碼 <i class="ky">B</i>（雙月「<b>朋</b>」拆為月月 <i class="cd">BB</i>）。`,
      `<b><span style="color:${C1}">⺼</span>（肉月旁）與 <span style="color:${C2}">冂</span>（下開口框）：</b>與身體有關的肉月旁（如「服」、「膽」），以及向下開口的三面框「<b style="color:${C2}">冂</b>」（如「同」、「冇」下部），均取 <i class="ky">B</i>。`,
      `<b><span style="color:${C3}">目、貝、豸</span>之取碼通則：</b>「<b style="color:${C3}">目</b>」拆月山（<i class="cd">BU</i>）；「<b style="color:${C3}">貝</b>」拆月山金（<i class="cd">BUC</i>，字首取 <i class="cd">BC</i>）；左偏旁「<b style="color:${C3}">豸</b>」（如「貓」、「貌」）上爪頭取月 (<i class="ky">B</i>)、下彎鉤兩撇取竹 (<i class="ky">H</i>)，固定拆為 <b>月竹（<i class="cd">BH</i>）</b>！`
    ],
    examples:[
      ["輔助形 ⺼",C1,"腦","BVVW",`左肉月旁「<b style="color:${C1}">⺼</b>」取月 (<i class="ky">B</i>)，右上三拐取女 (<i class="ky">V</i>)，右下頂撇連框取女田 (<i class="cd">VW</i>)，組為 <i class="cd">BVVW</i>。`],
      ["輔助形 冂",C2,"同","BMR",`外框「<b style="color:${C2}">冂</b>」取月 (<i class="ky">B</i>)，內部一橫取一 (<i class="ky">M</i>)、小方框取口 (<i class="ky">R</i>)，組為：月一口 (<i class="cd">BMR</i>)。`],
      ["輔助形 目/貝",C3,"見 / 財","BUHU / BCDH",`「<b style="color:${C3}">見</b>」上「<b style="color:${C3}">目</b>」拆月山 (<i class="cd">BU</i>)、下「儿」拆竹山 (<i class="cd">HU</i>) 為 <i class="cd">BUHU</i>；「<b style="color:${C3}">財</b>」左「<b style="color:${C3}">貝</b>」取首尾月金 (<i class="cd">BC</i>)、右「才」拆木竹 (<i class="cd">DH</i>) 為 <i class="cd">BCDH</i>。`],
      ["輔助形 豸",C3,"貓 / 貌","BHTW / BHHAU",`「<b style="color:${C3}">貓</b>」左「<b style="color:${C3}">豸</b>」取月竹 (<i class="cd">BH</i>)、右「苗」取廿田 (<i class="cd">TW</i>) 為 <i class="cd">BHTW</i>；「<b style="color:${C3}">貌</b>」左「<b style="color:${C3}">豸</b>」(<i class="cd">BH</i>) 右「兒」(<i class="cd">HAU</i>) 為 <i class="cd">BHHAU</i>。`]
    ],
    adv:`• <b style="color:${C2}">香港字實戰 —「冇」（<i class="cd">KB</i>）與「睇」（<i class="cd">BUCNH</i>）</b>：「<b style="color:${C2}">冇</b>」（沒有）上字首為橫撇「ナ」（取大 <i class="ky">K</i>），下字身為下開口框「<b style="color:${C2}">冂</b>」（取月 <i class="ky">B</i>），合為兩碼大月 (<i class="cd">KB</i>)；「<b>睇</b>」（看）左邊「<b style="color:${C3}">目</b>」取月山 (<i class="cd">BU</i>)，右邊「弟」取頭尾金弓竹 (<i class="cd">CNH</i>)，合為 <i class="cd">BUCNH</i>。<br>• <b>「冖」（秃寶蓋）對應</b>：無點的平頂蓋「<b>冖</b>」（如「冠」<i class="cd">BMUI</i>、「冤」<i class="cd">BNUI</i> 上部）亦歸入月 (<i class="ky">B</i>)。`,
    rhyme:"押韻：開／來／來，粵音 -oi 平聲",
    poem:`<b style="color:${C1}">肉旁</b><b style="color:${C2}">同框</b><i class="tr">月</i>字開，<b style="color:${C3}">目貝</b>下空入 <i class="ky">B</i> 來。　<i class="cd">中心</i><i class="tr">月</i>「<b style="color:${C1}">背</b>」<i class="cd">大</i><i class="tr">月</i>「<b style="color:${C2}">有</b>」，<i class="tr">月</i><i class="cd">山竹山</i>「<b style="color:${C3}">見</b>」就來。`
  },
  {
    key:"C", rad:"金", en:"Metal", cat:"第 4 / 26 頁：哲理類字根",
    aux:[
      {g:"釒", c:C1, title:"金字旁", desc:"左側金屬偏旁直取一碼 C（如：銅、錢）"},
      {g:"八", c:C2, title:"八字底", desc:"左撇右捺底腳（如：只、共、兵、興底）"},

      ["輔助形 八",C2,"共","TC",`上部「廿」取廿 (<i class="ky">T</i>)，下部八字底「<b style="color:${C2}">八</b>」取金 (<i class="ky">C</i>)，連為：廿金 (<i class="cd">TC</i>)。`],
      ["輔助形 丷",C3,"曾","CWA",`頂部倒八點「<b style="color:${C3}">丷</b>」取金 (<i class="ky">C</i>)，中扁框取田 (<i class="ky">W</i>)，底「日」取日 (<i class="ky">A</i>)，組為：金田日 (<i class="cd">CWA</i>)。`]

    adv:`• <b style="color:${C1}">香港字實戰 —「錶」（<i class="cd">CQMV</i>）與「釦」（<i class="cd">CR</i>）</b>：香港慣用的手錶之「<b>錶</b>」，左「<b style="color:${C1}">釒</b>」取金 (<i class="ky">C</i>)，右「表」取手一女 (<i class="cd">QMV</i>)，拆為 <i class="cd">CQMV</i>。<br>• <b style="color:${C2}">「八」與「人」字形辨析</b>：兩筆<b>分離不相交</b>的「<b style="color:${C2}">八</b> / <b style="color:${C3}">丷</b>」取金 (<i class="ky">C</i>)；兩筆<b>頂端相連</b>的「<b>人 / 𠆢</b>」則取人 (<i class="ky">O</i>)。`,

/* 渲染單一字根教學頁（curPage = 1..24） */

/* 狀態與導航控制（curPage = -1 為總目錄索引；0..25 為第 1..26 頁） */
let curPage = -1;

/* 返回主程式 index.html（同時相容 iframe postMessage、opener 與同視窗相對路徑跳轉） */
function exitToMainApp(){
  if(window.parent && window.parent !== window){
    window.parent.postMessage({type:"closeTutorial", action:"closeTutorial"}, "*");
    window.parent.postMessage("closeTutorial", "*");
    return;
  }
  if(window.opener && window.opener !== window && !window.opener.closed){
    window.close();
    return;
  }
  window.location.href = "index.html";
}

function goPage(idx){
  curPage = idx;
  const win = document.getElementById("mainWin");
  const btnEsc = document.getElementById("btnEscIdx");
  const btnPrev = document.getElementById("btnPrevPage");
  const btnNext = document.getElementById("btnNextPage");
  const hint = document.getElementById("footerHint");

  if(curPage === -1){
    win.innerHTML = renderIndexHTML();
    btnEsc.textContent = "Esc [主選單]";
    btnPrev.textContent = "◀ 總結";
    btnNext.textContent = "開始學習 ▶";
    hint.textContent = "點擊字根卡片或按 A-Y 進入 ｜ Esc 返回主選單 (index.html)";
    if(history.replaceState) history.replaceState(null, "", location.pathname);
  } else {
    const p = PAGES[curPage];
    if(p.type === "intro") win.innerHTML = renderIntroHTML();
    else if(p.type === "summary") win.innerHTML = renderSummaryHTML();
    else win.innerHTML = renderRadicalHTML(p);

    btnEsc.textContent = "Esc [索引]";
    btnPrev.textContent = curPage === 0 ? "◀ 返回索引" : "◀ 上一頁";
    btnNext.textContent = curPage === PAGES.length - 1 ? "返回索引 ▶" : "下一頁 ▶";
    hint.textContent = `第 ${curPage + 1} / 26 頁 ｜ Esc 返回索引 ｜ ← → 切換上下頁`;
    const hashTag = p.key ? p.key : (p.type === "intro" ? "INTRO" : "SUMMARY");
    if(history.replaceState) history.replaceState(null, "", "#" + hashTag);
  }
}

function prevPage(){
  if(curPage === -1) goPage(PAGES.length - 1);
  else if(curPage === 0) goPage(-1);
  else goPage(curPage - 1);
}

function nextPage(){
  if(curPage === -1) goPage(0);
  else if(curPage >= PAGES.length - 1) goPage(-1);
  else goPage(curPage + 1);
}

document.getElementById("btnEscIdx").addEventListener("click", () => {
  if(curPage === -1) exitToMainApp();
  else goPage(-1);
});
document.getElementById("btnPrevPage").addEventListener("click", prevPage);
document.getElementById("btnNextPage").addEventListener("click", nextPage);

/* 鍵盤控制：內頁按 Esc 返回索引目錄，在索引目錄再按 Esc 即返回主程式 index.html */
window.addEventListener("keydown", e => {
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.key === "Escape"){
    e.preventDefault();
    if(curPage === -1) exitToMainApp();
    else goPage(-1);
  } else if(e.key === "ArrowRight" || e.key === "Enter" || e.key === "PageDown"){
    e.preventDefault();
    nextPage();
  } else if(e.key === "ArrowLeft" || e.key === "PageUp"){
    e.preventDefault();
    prevPage();
  } else if(curPage === -1 && /^[a-wy]$/i.test(e.key)){
    const k = e.key.toUpperCase();
    const idx = PAGES.findIndex(p => p.key === k);
    if(idx !== -1){ e.preventDefault(); goPage(idx); }
  }
});

/* 畫面自適應縮放 */
function scaleScreen(){
  const el = document.getElementById("dosScreen");
  if(!el) return;
  const W = window.innerWidth, H = window.innerHeight;
  const sc = Math.min((W - 12) / 960, (H - 12) / 540);
  el.style.transform = `scale(${Math.max(0.25, sc).toFixed(4)})`;
}
window.addEventListener("resize", scaleScreen);
scaleScreen();

/* 支援網址 Hash（如 #A、#Q、#INTRO、#SUMMARY）初始化與動態切換 */
function applyHashRoute(){
  const h = location.hash.replace("#","").toUpperCase();
  if(!h){ goPage(-1); return; }
  if(h === "INTRO" || h === "01" || h === "1"){ goPage(0); return; }
  if(h === "SUMMARY" || h === "26"){ goPage(25); return; }
  const idx = PAGES.findIndex(p => p.key === h);
  goPage(idx !== -1 ? idx : -1);
}
window.addEventListener("hashchange", applyHashRoute);
applyHashRoute();
</script>

<style id="unifiedScrollStyle">
.scroll-box, #tutPageContent, .tut-content {
  overflow-y: auto !important;
  overscroll-behavior: contain;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}
</style>
<script id="unifiedScrollScript">
/* === UNIFIED_SCROLL_HELPER_START === */
(function(){
  const STEP = 95;
  function getActiveScrollBox(){
    const selectors = [
      "#tutPageContent",
      "#aboutWindow > div:nth-child(2)",
      "#leaderboardWindow > div:nth-child(2)",
      ".tut-content"
    ];
    for(const sel of selectors){
      const el = document.querySelector(sel);
      if(el && el.offsetParent !== null) return el;
    }
    return null;
  }
  function scrollActiveBox(deltaY){
    const box = getActiveScrollBox();
    if(!box) return false;
    box.scrollBy({ top: deltaY, behavior: "smooth" });
    return true;
  }
  window.__scrollActiveBox = scrollActiveBox;

  // 1. 滑鼠滾輪全區域支援
  window.addEventListener("wheel", function(e){
    const box = getActiveScrollBox();
    if(!box) return;
    if(!box.contains(e.target)){
      box.scrollTop += e.deltaY;
    }
  }, { passive: true });

  // 2. 鍵盤上下鍵集中攔截支援
  window.addEventListener("keydown", function(e){
    if(e.ctrlKey || e.metaKey || e.altKey) return;
    const el = document.activeElement;
    if(el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA")) return;
    if(e.key === "ArrowUp"){
      if(scrollActiveBox(-STEP)) e.preventDefault();
    } else if(e.key === "ArrowDown"){
      if(scrollActiveBox(STEP)) e.preventDefault();
    }
  }, true);

})();
/* === UNIFIED_SCROLL_HELPER_END === */
</script>
