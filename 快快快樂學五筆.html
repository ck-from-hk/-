<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>快快快樂學五筆 - 中國大陸非拼音輸入法完全指南（全書互動版）</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none;margin:0;background:#111;width:100vw;height:100vh;height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;font-family:"BiauKaiHK","DFKai-SB","標楷體","Microsoft JhengHei",serif;overflow:hidden}
.dos-screen{width:960px;height:540px;background:#005a52;position:relative;border:3px solid #808080;box-shadow:0 0 25px rgba(0,0,0,.9);display:flex;flex-direction:column;justify-content:space-between;transform-origin:center;flex-shrink:0}
.dos-header{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0}
.slop-logo{display:flex;align-items:center;justify-content:center;width:95px;height:30px}
.title-group{display:flex;align-items:center;flex:1;justify-content:center;gap:16px}
.magenta-double-line{flex:1;height:8px;border-top:3px solid #f0f;border-bottom:3px solid #f0f}
.dos-main-title{color:#ff0;font-size:29px;font-weight:bold;letter-spacing:5px;text-shadow:2px 2px #000;white-space:nowrap;padding:0 10px}
.dos-stage{flex:1;position:relative;display:flex;justify-content:center;align-items:center;padding:8px 20px;overflow:hidden}
.dos-footer{height:36px;background:#c0c0c0;border-top:2px solid #fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0;z-index:10}
.key-button{background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;font-weight:bold;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:#000080;cursor:pointer;font-family:Consolas,"Microsoft JhengHei",monospace;padding:0 12px;text-decoration:none}
.key-button:active{border-color:#404040 #fff #fff #404040;background:#a8a8a8}

.sub-window{background:#003833;border:3px double #5ff;width:100%;height:100%;padding:10px 18px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:6px 6px 0 rgba(0,0,0,.5);z-index:10}
.sub-win-title{color:#ff5;font-size:18.5px;font-weight:bold;border-bottom:2px solid #5ff;padding-bottom:4px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.category-badge{background:#004b45;border:1px solid #5ff;color:#ff5;font-size:12px;padding:1px 8px;margin-left:8px}

/* 教學內容捲動區 */
.tut-content{overflow-y:auto;flex:1;font-size:14px;color:#fff;line-height:1.66;margin:4px 0;padding-right:6px;overscroll-behavior:contain;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.tut-h{font-weight:bold;font-size:14.5px;margin-top:8px}
.tut-h.y{color:#ff5}.tut-h.g{color:#5f5}.tut-h.o{color:#fa5}.tut-h.c{color:#5ff}
.tut-content i{font-style:normal;font-weight:bold}
.tut-content .tr{color:#ff5}.tut-content .ky{color:#0ff}.tut-content .cd{color:#fa5}.tut-content .ch{color:#ff5}

/* 主字根＋放大彩色輔助字形展示區 */
.rad-hero-box{display:flex;align-items:stretch;background:rgba(0,0,0,.38);border:2px solid #ff0;padding:8px 14px;gap:14px;margin:2px 0 6px;border-radius:4px}
.rad-main-card{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#002220;border:2px solid #ff5;padding:4px 10px;min-width:94px;box-shadow:inset 2px 2px 5px rgba(0,0,0,.85);flex-shrink:0}
.rad-big-char{font-size:46px;color:#ff5;line-height:1.05;font-weight:bold;text-shadow:2px 2px #000}
.rad-key-tag{font-size:12px;color:#0ff;font-weight:bold;margin-top:3px;font-family:Consolas,monospace;background:#003b36;padding:1px 7px;border:1px solid #0ff;white-space:nowrap}

.rad-right-panel{display:flex;flex-direction:column;justify-content:space-between;flex:1;gap:5px}
.aux-showcase-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.aux-chip{display:inline-flex;align-items:center;gap:8px;background:rgba(0,30,35,.9);border:1px solid #5ff;padding:3px 9px;border-radius:3px}
.aux-glyph{font-size:23px;font-weight:bold;line-height:1;text-shadow:1px 1px #000}
.aux-desc{font-size:12px;color:#eee;line-height:1.25}
.aux-desc b{display:block;font-size:12.5px}

/* 範例表格 */
.retro-table{width:100%;border-collapse:collapse;color:#fff;font-size:13px;margin-top:4px}
.retro-table th,.retro-table td{border:1px solid #5ff;padding:3.5px 8px;text-align:center}
.retro-table th{background:#002220;color:#ff5}
.retro-table td:nth-child(3){font-family:Consolas,monospace;color:#ff5;font-weight:bold;white-space:nowrap}
.aux-pill-mini{display:inline-block;padding:1px 6px;border-radius:2px;font-weight:bold;font-size:12px;background:rgba(0,0,0,.4);white-space:nowrap}

/* 進階補充卡 */
.adv-aux-box{background:rgba(0,40,65,.55);border:1px dashed #5ff;padding:6px 12px;margin-top:5px;border-radius:3px;font-size:12.5px;line-height:1.55}

/* 單行口訣框 */
.poem-line-box{font-size:16px;line-height:1.8;background:rgba(0,0,0,.28);padding:6px 1.5em;border-left:4px solid #ff5;border-right:4px solid #ff5;margin-top:4px;text-align:center;white-space:nowrap;overflow-x:auto}

/* 索引頁專用緊湊免捲動樣式 */
.idx-board{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;gap:4px;padding:1px 0;overflow:hidden}
.cat-group{background:rgba(0,0,0,.28);border:1px solid #00695c;padding:4px 8px;border-radius:3px}
.cat-header{font-size:12.5px;font-weight:bold;margin-bottom:3px;display:flex;justify-content:space-between;line-height:1.1}
.rad-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.rad-card{background:#002220;border:1.5px solid #5ff;padding:2.5px 3px;text-align:center;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .12s;cursor:pointer}
.rad-card:hover,.rad-card:focus{background:#004d40;border-color:#ff0;outline:none}
.rad-card .rk{font-family:Consolas,monospace;font-size:11.5px;color:#0ff;font-weight:bold;line-height:1.05}
.rad-card .rc{font-size:18px;color:#ff5;font-weight:bold;line-height:1.15}
.rad-card .rs{font-size:9.5px;color:#bbb;line-height:1.05;white-space:nowrap}
.rad-card.intro-card{flex-direction:row;gap:6px;padding:4px 6px;border-color:#ff5}
.rad-card.intro-card .rc{font-size:13px;color:#ff5;line-height:1.1}

/* 引言與專題卡片 */
.cat-overview-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:5px 0}
.cat-box{background:rgba(0,0,0,.32);border:1px solid #5ff;padding:5px 8px;border-radius:3px;font-size:12px;line-height:1.4}
.cat-box b{display:block;font-size:12.5px;margin-bottom:2px}
.xz-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:5px}
.xz-card{background:rgba(0,25,30,.75);border:1.5px solid #ff5;padding:7px 12px;border-radius:4px;display:flex;gap:12px;align-items:flex-start}
.xz-glyph-box{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#002220;border:1.5px solid #0ff;padding:4px 10px;min-width:60px;flex-shrink:0}
.xz-glyph{font-size:30px;font-weight:bold;line-height:1.1}
.xz-key{font-family:Consolas,monospace;font-size:11.5px;font-weight:bold;margin-top:2px;padding:0 5px;background:#003b36;white-space:nowrap}

@media(max-width:480px){.dos-screen{transform:scale(.4)}}
@media(min-width:481px)and(max-width:768px){.dos-screen{transform:scale(.6)}}
</style>
</head>
<body>
<div class="dos-screen" id="dosScreen">
  <div class="dos-header">
    <div class="slop-logo" title="WUBI 86 經典標誌"><svg viewBox="0 0 120 40" width="95" height="30"><ellipse cx="60" cy="20" rx="55" ry="16" fill="none" stroke="#0ff" stroke-width="2"/><text x="50%" y="62%" text-anchor="middle" fill="#f0f" font-size="18" font-weight="900" font-style="italic" font-family="Arial">WUBI86</text></svg></div>
    <div class="title-group">
      <div class="magenta-double-line"></div>
      <div class="dos-main-title">快快快樂學五筆</div>
      <div class="magenta-double-line"></div>
    </div>
  </div>

  <div class="dos-stage">
    <div class="sub-window" id="mainWin"></div>
  </div>

  <div class="dos-footer">
    <div style="display:flex;gap:10px;align-items:center">
      <button type="button" class="key-button" id="btnEscIdx" style="color:#800000" title="返回總目錄索引">Esc [索引]</button>
    </div>
    <div id="footerHint" style="font-size:12px;color:#333;flex:1;text-align:center">Esc 返回索引 ｜ ← → 切換上下頁 ｜ ↑ ↓ 捲動內文</div>
    <div style="display:flex;gap:8px;align-items:center">
      <button type="button" class="key-button" id="btnPrevPage">◀ 上一頁</button>
      <button type="button" class="key-button" id="btnNextPage">下一頁 ▶</button>
    </div>
  </div>
</div>

<script>
"use strict";
const C1="#0ff", C2="#5f5", C3="#ff80ab";

/* 全書 31 頁結構化教材資料（0=引言, 1..25=五筆25鍵字根, 26=拆字規則, 27=手寫語音, 28=九宮格筆畫, 29=兩岸對比, 30=總結） */
const PAGES = [
  { type:"intro" },
  /* ================= 一、橫區（1 區：G F D S A） ================= */
  {
    key:"G", zone:"11", rad:"王", short1:"一", cat:"第 2 / 31 頁：橫區（1 區）字根",
    aux:[
      {g:"王五一", c:C1, title:"主幹字根", desc:"王、五、一（基本橫畫首鍵）"},
      {g:"戋", c:C2, title:"兼字右旁", desc:"「践、浅、钱」的右半部部件"},
      {g:"龺", c:C3, title:"青字頭", desc:"「青、静、素、表」頂部部件"}
    ],
    slogan:`王旁青頭戋（兼）五一 —— 橫區首鍵（<i class="ky">11</i>），一級簡碼為「<b class="tr">一</b>」。`,
    rules:[
      `<b>鍵名字「王」：</b>連擊四下 <i class="cd">GGGG</i> 直接打出「<b class="tr">王</b>」；按一下 <i class="ky">G</i> 加空格打出高頻一級簡碼「<b class="tr">一</b>」。`,
      `<b>基本筆畫「橫（一）」與「提（㇀）」：</b>五筆將「橫」與「提」歸為第一類筆畫，凡單筆橫畫或提畫均落在 <i class="ky">G</i> 鍵。`,
      `<b>「青字頭」<span style="color:${C3}">龺</span> 與「戋」<span style="color:${C2}">戋</span>：</b>「青、毒、责」頂部的三橫一豎（不出頭）歸入 <i class="ky">G</i>；「戋」單獨成字拆為 <i class="cd">GGGT</i>（戋＋撇）。`
    ],
    examples:[
      ["一級簡碼","#ff5","一","G + 空格","高頻一級簡碼，單擊 G 鍵加空格即出字。"],
      ["鍵名字","#ff5","王","GGGG","鍵面代表字，連擊所在鍵四次。"],
      ["青字頭",C3,"青","GEF","上青字頭 (<i class=\"ky\">G</i>) ＋ 下月 (<i class=\"ky\">E</i>) ＋ 末筆識別碼橫 (<i class=\"ky\">F</i>)。"],
      ["戋字旁",C2,"浅","IGGT","左三點水 (<i class=\"ky\">I</i>) ＋ 右「戋」(<i class=\"ky\">G</i>) ＋ 末筆識別碼撇 (<i class=\"ky\">T</i>)，不足補 <i class=\"ky\">G</i>。"]
    ],
    adv:`• <b style="color:${C1}">成字字根「五」拆碼（<i class="cd">GGHG</i>）</b>：先報戶口 <i class="ky">G</i>，再取第一筆橫 (<i class="ky">G</i>)、第二筆豎 (<i class="ky">H</i>)、末筆橫 (<i class="ky">G</i>)。<br>• <b style="color:${C2}">橫區定位口訣</b>：橫區位於鍵盤中排左手（G、F、D、S、A），由食指 G 鍵（一畫）向小指 A 鍵（五畫）遞增。`,
    poem:`<i class="tr">王</i>旁<b style="color:${C3}">青頭</b><b style="color:${C2}">戋</b>五<i class="tr">一</i>（<i class="ky">G 11</i>）`
  },
  {
    key:"F", zone:"12", rad:"土", short1:"地", cat:"第 3 / 31 頁：橫區（1 區）字根",
    aux:[
      {g:"土士", c:C1, title:"土與士", desc:"上短下長「土」與上長下短「士」同鍵"},
      {g:"二干十寸", c:C2, title:"兩橫主幹", desc:"二、干、十、寸（如：吉、古、村、对）"},
      {g:"雨廿", c:C3, title:"雨與革字頭", desc:"「雨」與「革」字上半部（如：雪、鞋）"}
    ],
    slogan:`土士二干十寸雨 —— 橫區第二鍵（<i class="ky">12</i>），一級簡碼為「<b class="tr">地</b>」。`,
    rules:[
      `<b>鍵名字「土」與一級簡碼「地」：</b>連擊 <i class="cd">FFFF</i> 打出「<b class="tr">土</b>」；單擊 <i class="ky">F</i> 加空格打出「<b class="tr">地</b>」（「地」全碼為 <i class="cd">FBN</i>）。`,
      `<b><span style="color:${C1}">土</span> 與 <span style="color:${C1}">士</span> 不分長短：</b>五筆中無論上橫短的「土」還是上橫長的「士」（如「吉」<i class="cd">FKF</i>、「志」<i class="cd">FNU</i>），一律歸入 <i class="ky">F</i> 鍵。`,
      `<b><span style="color:${C2}">十、寸、干、二</span> 與 <span style="color:${C3}">雨</span>：</b>高頻偏旁「十」（如「古」<i class="cd">FD</i>）、「寸」（如「对」<i class="cd">CFY</i>）與「雨字頭」（如「雪」<i class="cd">FVF</i>）均在 <i class="ky">F</i> 鍵。`
    ],
    examples:[
      ["一級簡碼","#ff5","地","F + 空格","高頻一級簡碼（全碼：土 F ＋ 也 BN = FBN）。"],
      ["鍵名字","#ff5","土","FFFF","鍵面代表字，連擊 F 鍵四次。"],
      ["成字字根",C3,"雨","FGHY","報戶口 F ＋ 首筆橫 G ＋ 次筆豎 H ＋ 末筆點 Y。"],
      ["士字頭",C1,"吉","FKF","上士 (<i class=\"ky\">F</i>) ＋ 下口 (<i class=\"ky\">K</i>) ＋ 上下型橫末筆識別碼 (<i class=\"ky\">F</i>)。"]
    ],
    adv:`• <b style="color:${C2}">成字字根「寸」拆碼（<i class="cd">FGH</i>）</b>：報戶口 <i class="ky">F</i> ＋ 首筆橫 (<i class="ky">G</i>) ＋ 次筆豎鉤 (<i class="ky">H</i>)，三碼加空格即出字（注意末筆點不重複取碼，因已取滿首、次、末三筆）。`,
    poem:`<i class="tr">土</i><b style="color:${C1}">士</b><b style="color:${C2}">二干十寸</b><b style="color:${C3}">雨</b>（<i class="ky">F 12</i>）`
  },
  {
    key:"D", zone:"13", rad:"大", short1:"在", cat:"第 4 / 31 頁：橫區（1 區）字根",
    aux:[
      {g:"大犬三", c:C1, title:"大犬與三橫", desc:"大、犬、三（如：太、哭、春上三橫）"},
      {g:"古石廠", c:C2, title:"古石與廠框", desc:"古、石、厂（如：故、硬、原、历）"},
      {g:"𦍌", c:C3, title:"羊字頭/龍框", desc:"羊無尾（如：美、差、着）與龍字左框"}
    ],
    slogan:`大犬三（羊）古石廠 —— 橫區第三鍵（<i class="ky">13</i>），一級簡碼為「<b class="tr">在</b>」。`,
    rules:[
      `<b>鍵名字「大」與一級簡碼「在」：</b>連擊 <i class="cd">DDDD</i> 打出「<b class="tr">大</b>」；單擊 <i class="ky">D</i> 加空格打出「<b class="tr">在</b>」（「在」全碼為 <i class="cd">DHFD</i>）。`,
      `<b><span style="color:${C1}">大、犬、三</span> 與 <span style="color:${C3}">羊字頭</span>：</b>「大」字家族與三橫「三」（如「春」拆為 <i class="cd">DWJF</i>：三＋人＋日）及「羊字無尾」（如「美」<i class="cd">UGDU</i>）均在 <i class="ky">D</i>。`,
      `<b><span style="color:${C2}">古、石、厂</span>：</b>「古」在 F 鍵上是「十＋口」，但在 D 鍵上已是現成字根（取大優先，如「故」拆為 <i class="cd">DTY</i>：古＋攵）。`
    ],
    examples:[
      ["一級簡碼","#ff5","在","D + 空格","高頻一級簡碼（全碼：大 D ＋ 丨 H ＋ 土 F ＋ 識別碼 D）。"],
      ["鍵名字","#ff5","大","DDDD","鍵面代表字，連擊 D 鍵四次。"],
      ["取大優先",C2,"故","DTY","左「古」直接取 <i class=\"ky\">D</i>（不拆十口）＋ 右反文旁「攵」(<i class=\"ky\">T</i>) ＋ 識別碼 <i class=\"ky\">Y</i>。"],
      ["成字字根",C2,"石","DGTG","報戶口 D ＋ 首筆橫 G ＋ 次筆撇 T ＋ 末筆橫 G。"]
    ],
    adv:`• <b style="color:${C2}">「取大優先」經典範例</b>：打「<b>胡</b>」字時，左邊「古」直接取 <i class="ky">D</i>，右邊「月」取 <i class="ky">E</i>，再補左右型橫末筆識別碼 <i class="ky">G</i>，即 <i class="cd">DEG</i>（切勿把古拆成十口）。`,
    poem:`<i class="tr">大</i><b style="color:${C1}">犬三</b>（<b style="color:${C3}">羊</b>）<b style="color:${C2}">古石廠</b>（<i class="ky">D 13</i>）`
  },
  {
    key:"S", zone:"14", rad:"木", short1:"要", cat:"第 5 / 31 頁：橫區（1 區）字根",
    aux:[
      {g:"木朩", c:C1, title:"木與木字底", desc:"木字旁、木字底（如：林、森、茶、李）"},
      {g:"丁", c:C2, title:"丁字部件", desc:"一橫一豎鉤（如：打、顶、灯、可框）"},
      {g:"西覀", c:C3, title:"西與西字頭", desc:"西字與扁西頭（如：要、票、覆、栗）"}
    ],
    slogan:`木丁西 —— 橫區第四鍵（<i class="ky">14</i>），一級簡碼為「<b class="tr">要</b>」。`,
    rules:[
      `<b>鍵名字「木」與一級簡碼「要」：</b>連擊 <i class="cd">SSSS</i> 打出「<b class="tr">木</b>」；單擊 <i class="ky">S</i> 加空格打出「<b class="tr">要</b>」（「要」全碼為 <i class="cd">SVF</i>：覀＋女）。`,
      `<b><span style="color:${C1}">木</span>（字根最簡潔鍵位之一）：</b>S 鍵僅有「木、丁、西」三個核心字根，極易記憶。「林」為 <i class="cd">SS</i>，「森」為 <i class="cd">SSS</i>。`,
      `<b><span style="color:${C3}">西 / 覀</span>：</b>無論完整的「西」（如「晒」<i class="cd">JSG</i>）或壓扁的西字頭「覀」（如「票」<i class="cd">SFIU</i>），一律取 <i class="ky">S</i>。`
    ],

      <div class="tut-h g" style="margin-top:6px">📌 簡體字打五筆最常遇到的五大「簡化變身」速記</div>
      <div class="adv-aux-box">
        • <b>简體「讠」（言字旁）</b> → 直接按 <i class="ky">Y</i>（如：话 <i class="cd">YTDG</i>、说 <i class="cd">YUKQ</i>、请 <i class="cd">YGEG</i>）<br>
        • <b>简體「钅」（金字旁）</b> → 直接按 <i class="ky">Q</i>（如：铁 <i class="cd">QRWY</i>、钱 <i class="cd">QGT</i>、银 <i class="cd">QVEY</i>）<br>
        • <b>简體「纟」（絞絲旁）</b> → 直接按 <i class="ky">X</i>（如：红 <i class="cd">XAG</i>、经 <i class="cd">XCA</i>、线 <i class="cd">XGT</i>）<br>
        • <b>简體「门」（門字框）</b> → 直接按 <i class="ky">U</i>（如：问 <i class="cd">UKD</i>、间 <i class="cd">UJD</i>、闭 <i class="cd">UFT</i>）<br>

/* 渲染單一五筆字根教學頁（curPage = 1..25） */
function renderRadicalHTML(p){
  const k = p.key;
  const auxHtml = p.aux.map(a=>`
    <div class="aux-chip" style="border-color:${a.c}">
      <span class="aux-glyph" style="color:${a.c}">${a.g}</span>
      <div class="aux-desc"><b style="color:${a.c}">${a.title}</b>${a.desc}</div>
    </div>
  `).join("");

  const rulesHtml = p.rules.map(r=>`• ${r}`).join("<br>");

  const exRows = p.examples.map(e=>`
    <tr>
      <td><span class="aux-pill-mini" style="color:${e[1]};border:1px solid ${e[1]}">${e[0]}</span></td>
      <td><span style="font-size:18px;color:${e[1]};font-weight:bold">${e[2]}</span></td>
      <td>${e[3]}</td>
      <td style="text-align:left">${e[4]}</td>
    </tr>
  `).join("");

  return `
    <div class="sub-win-title">
      <div><span>📖 五筆 86 版字根專講</span><span class="category-badge">${p.cat}</span></div>
      <span style="font-size:13.5px;color:#aaa">[<i style="color:#0ff;font-style:normal">${k} 鍵 / ${p.zone}區</i>] 鍵名「${p.rad}」｜一級簡碼「<b style="color:#ff5">${p.short1}</b>」</span>
    </div>

    <div class="tut-content" id="tutPageContent">
      <div class="rad-hero-box">
        <div class="rad-main-card">
          <div class="rad-big-char">${p.rad}</div>
          <div class="rad-key-tag">${k} 鍵 (${p.zone})</div>
        </div>
        <div class="rad-right-panel">
          <div style="font-size:13px;color:#ff5;font-weight:bold">同鍵核心字根群（全部歸入 <span style="color:#0ff">${k} 鍵</span>｜一級簡碼：<span style="color:#5f5">${p.short1}</span>）：</div>
          <div class="aux-showcase-row">${auxHtml}</div>
          <div style="font-size:12px;color:#5ff">💡 記憶要訣：${p.slogan}</div>
        </div>
      </div>

      <div class="tut-h y">▶ 字根取碼細節與簡體應用規範</div>
      <div style="font-size:13px;margin-top:2px">${rulesHtml}</div>

      <div class="tut-h g" style="margin-top:6px">▶ 實戰拆碼範例（涵蓋一級簡碼、鍵名字與常用合體字）</div>
      <table class="retro-table">
        <thead>
          <tr><th>類別／字根</th><th>漢字</th><th>五筆編碼</th><th>結構拆解與詳細說明</th></tr>
        </thead>
        <tbody>${exRows}</tbody>
      </table>

      ${p.adv ? `<div class="tut-h c" style="margin-top:7px">▶ 進階成字字根與結構辨析</div><div class="adv-aux-box">${p.adv}</div>` : ""}

      <div class="tut-h o" style="margin-top:7px">🎵 86 版五筆官方記憶口訣（鍵盤區位 ${p.zone}）</div>
      <div class="poem-line-box">${p.poem}</div>
    </div>
  `;
}

/* 狀態與導航控制（curPage = -1 為總目錄索引；0..30 為第 1..31 頁） */
let curPage = -1;

function goPage(idx){
  curPage = idx;
  const win = document.getElementById("mainWin");
  const btnEsc = document.getElementById("btnEscIdx");
  const btnPrev = document.getElementById("btnPrevPage");
  const btnNext = document.getElementById("btnNextPage");
  const hint = document.getElementById("footerHint");

  if(curPage === -1){
    win.innerHTML = renderIndexHTML();
    btnEsc.textContent = "Esc [目錄]";
    btnPrev.textContent = "◀ 總結";
    btnNext.textContent = "開始閱讀 ▶";
    hint.textContent = "點擊字根卡片或按 A-Y 跳轉 ｜ 按 Enter / → 從第 1 頁引言開始閱讀";
  } else {
    const p = PAGES[curPage];
    if(p.type === "intro") win.innerHTML = renderIntroHTML();
    else if(p.type === "wubi_rules") win.innerHTML = renderWubiRulesHTML();
    else if(p.type === "hand_voice") win.innerHTML = renderHandVoiceHTML();
    else if(p.type === "stroke_t9") win.innerHTML = renderStrokeHTML();
    else if(p.type === "compare_3") win.innerHTML = renderCompareHTML();
    else if(p.type === "summary") win.innerHTML = renderSummaryHTML();
    else win.innerHTML = renderRadicalHTML(p);

    btnEsc.textContent = "Esc [索引]";
    btnPrev.textContent = curPage === 0 ? "◀ 返回索引" : "◀ 上一頁";
    btnNext.textContent = curPage === PAGES.length - 1 ? "返回索引 ▶" : "下一頁 ▶";
    hint.textContent = `第 ${curPage + 1} / ${PAGES.length} 頁 ｜ Esc 返回索引 ｜ ← → 切換上下頁 ｜ ↑ ↓ 捲動內文`;
  }
}

function prevPage(){
  if(curPage === -1) goPage(PAGES.length - 1);
  else if(curPage === 0) goPage(-1);
  else goPage(curPage - 1);
}

function nextPage(){
  if(curPage === -1) goPage(0);
  else if(curPage >= PAGES.length - 1) goPage(-1);
  else goPage(curPage + 1);
}

document.getElementById("btnEscIdx").addEventListener("click", () => {
  goPage(-1);
});
document.getElementById("btnPrevPage").addEventListener("click", prevPage);
document.getElementById("btnNextPage").addEventListener("click", nextPage);

/* 通用捲動輔助 */
function getActiveScrollBox(){
  const el = document.querySelector("#tutPageContent, .tut-content");
  return (el && el.offsetParent !== null) ? el : null;
}
function scrollActiveBox(deltaY){
  const box = getActiveScrollBox();
  if(!box) return false;
  box.scrollBy({ top: deltaY, behavior: "smooth" });
  return true;
}
window.addEventListener("wheel", e => {
  const box = getActiveScrollBox();
  if(box && !box.contains(e.target)) box.scrollTop += e.deltaY;
}, { passive: true });

/* 鍵盤控制 */
window.addEventListener("keydown", e => {
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.key === "Escape"){
    e.preventDefault();
    goPage(-1);
  } else if(e.key === "ArrowRight" || e.key === "Enter" || e.key === "PageDown"){
    e.preventDefault();
    nextPage();
  } else if(e.key === "ArrowLeft" || e.key === "PageUp"){
    e.preventDefault();
    prevPage();
  } else if(e.key === "ArrowUp"){
    if(scrollActiveBox(-95)) e.preventDefault();
  } else if(e.key === "ArrowDown"){
    if(scrollActiveBox(95)) e.preventDefault();
  } else if(curPage === -1 && /^[a-y]$/i.test(e.key)){
    const k = e.key.toUpperCase();
    const idx = PAGES.findIndex(p => p.key === k);
    if(idx !== -1){ e.preventDefault(); goPage(idx); }
  }
});

/* 畫面自適應縮放 */
function scaleScreen(){
  const el = document.getElementById("dosScreen");
  if(!el) return;
  const W = window.innerWidth, H = window.innerHeight;
  const sc = Math.min((W - 12) / 960, (H - 12) / 540);
  el.style.transform = `scale(${Math.max(0.25, sc).toFixed(4)})`;
}
window.addEventListener("resize", scaleScreen);
scaleScreen();

/* 預設啟動顯示總目錄索引頁 */
const initHash = location.hash.replace("#","").toUpperCase();
const hashIdx = PAGES.findIndex(p => p.key === initHash);
goPage(hashIdx !== -1 ? hashIdx : -1);
</script>
