<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>快快快樂學大易 - 大易輸入法 40 鍵完全指南（全書 46 頁互動版）</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none;margin:0;background:#111;width:100vw;height:100vh;height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;font-family:"BiauKaiHK","DFKai-SB","標楷體","Microsoft JhengHei",serif;overflow:hidden}
.dos-screen{width:960px;height:540px;background:#003a5c;position:relative;border:3px solid #808080;box-shadow:0 0 25px rgba(0,0,0,.9);display:flex;flex-direction:column;justify-content:space-between;transform-origin:center;flex-shrink:0}
.dos-header{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0}
.slop-logo{display:flex;align-items:center;justify-content:center;width:95px;height:30px}
.title-group{display:flex;align-items:center;flex:1;justify-content:center;gap:16px}
.magenta-double-line{flex:1;height:8px;border-top:3px solid #ff5555;border-bottom:3px solid #ff5555}
.dos-main-title{color:#ff0;font-size:29px;font-weight:bold;letter-spacing:5px;text-shadow:2px 2px #000;white-space:nowrap;padding:0 10px}
.dos-stage{flex:1;position:relative;display:flex;justify-content:center;align-items:center;padding:6px 18px;overflow:hidden}
.dos-footer{height:36px;background:#c0c0c0;border-top:2px solid #fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0;z-index:10}
.key-button{background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;font-weight:bold;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:#000080;cursor:pointer;font-family:Consolas,"Microsoft JhengHei",monospace;padding:0 12px;text-decoration:none}
.key-button:active{border-color:#404040 #fff #fff #404040;background:#a8a8a8}

.sub-window{background:#002238;border:3px double #5ff;width:100%;height:100%;padding:8px 16px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:6px 6px 0 rgba(0,0,0,.5);z-index:10}
.sub-win-title{color:#ff5;font-size:18px;font-weight:bold;border-bottom:2px solid #5ff;padding-bottom:3px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.category-badge{background:#004b75;border:1px solid #5ff;color:#ff5;font-size:12px;padding:1px 8px;margin-left:8px}

/* 教學內容捲動區 */
.tut-content{overflow-y:auto;flex:1;font-size:13.5px;color:#fff;line-height:1.62;margin:4px 0;padding-right:6px;overscroll-behavior:contain;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.tut-h{font-weight:bold;font-size:14.5px;margin-top:7px}
.tut-h.y{color:#ff5}.tut-h.g{color:#5f5}.tut-h.o{color:#fa5}.tut-h.c{color:#5ff}
.tut-content i{font-style:normal;font-weight:bold}
.tut-content .tr{color:#ff5}.tut-content .ky{color:#0ff}.tut-content .cd{color:#fa5}.tut-content .ch{color:#ff5}

/* 主字根＋放大彩色輔助字形展示區 */
.rad-hero-box{display:flex;align-items:stretch;background:rgba(0,0,0,.38);border:2px solid #ff0;padding:5px 10px;gap:10px;margin:2px 0 4px;border-radius:4px}
.rad-main-card{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#001525;border:2px solid #ff5;padding:3px 8px;min-width:84px;box-shadow:inset 2px 2px 5px rgba(0,0,0,.85);flex-shrink:0}
.rad-big-char{font-size:38px;color:#ff5;line-height:1.05;font-weight:bold;text-shadow:2px 2px #000}
.rad-key-tag{font-size:11px;color:#0ff;font-weight:bold;margin-top:2px;font-family:Consolas,monospace;background:#003b36;padding:1px 6px;border:1px solid #0ff;white-space:nowrap}

.rad-right-panel{display:flex;flex-direction:column;justify-content:space-between;flex:1;gap:3px}
.aux-showcase-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.aux-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(0,30,45,.9);border:1px solid #5ff;padding:2px 7px;border-radius:3px}
.aux-glyph{font-size:19px;font-weight:bold;line-height:1;text-shadow:1px 1px #000}
.aux-desc{font-size:11px;color:#eee;line-height:1.2}
.aux-desc b{display:block;font-size:11.5px}

/* 一行兩字雙欄範例網格（單頁免捲動） */
.ex-grid-2col{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:3px}
.ex-card{display:flex;align-items:center;gap:6px;background:rgba(0,22,38,.85);border:1px solid #5ff;padding:3px 7px;border-radius:3px;font-size:12px;line-height:1.28}
.ex-card.span-2{grid-column:1 / -1}
.ex-char{font-size:18px;font-weight:bold;min-width:22px;text-align:center;flex-shrink:0}
.ex-code{font-family:Consolas,monospace;color:#ff5;font-weight:bold;background:#00121e;border:1px solid #006699;padding:1px 5px;border-radius:2px;white-space:nowrap;flex-shrink:0}
.ex-note{color:#e8f4f8;flex:1;text-align:left}

/* 範例表格（專題頁使用） */
.retro-table{width:100%;border-collapse:collapse;color:#fff;font-size:12.8px;margin-top:3px}
.retro-table th,.retro-table td{border:1px solid #5ff;padding:3px 7px;text-align:center}
.retro-table th{background:#001c30;color:#ff5}
.retro-table td:nth-child(3){font-family:Consolas,monospace;color:#ff5;font-weight:bold;white-space:nowrap}
.aux-pill-mini{display:inline-block;padding:1px 5px;border-radius:2px;font-weight:bold;font-size:10.5px;background:rgba(0,0,0,.45);white-space:nowrap;flex-shrink:0}

/* 進階補充卡 */
.adv-aux-box{background:rgba(0,40,65,.55);border:1px dashed #5ff;padding:6px 11px;margin-top:5px;border-radius:3px;font-size:12.5px;line-height:1.52}

/* 單行口訣框 */
.poem-line-box{font-size:14.5px;line-height:1.55;background:rgba(0,0,0,.28);padding:3px 1em;border-left:4px solid #ff5;border-right:4px solid #ff5;margin-top:3px;text-align:center;white-space:nowrap;overflow-x:auto}

/* 索引頁專用精準比例免捲動樣式（四行 × 每行 10 鍵） */
.idx-board{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between;gap:4px;padding:3px 0;overflow:hidden}
.top-nav-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;flex-shrink:0}
.cat-group{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;background:rgba(0,0,0,.28);border:1px solid #005b8c;padding:3px 7px;border-radius:3px}
.cat-header{font-size:11px;font-weight:bold;margin-bottom:2px;display:flex;justify-content:space-between;align-items:center;line-height:1;flex-shrink:0}
.rad-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.rad-card{background:#001c30;border:1.5px solid #5ff;padding:2px 1px;text-align:center;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .12s;cursor:pointer;min-height:0;overflow:hidden;width:100%}
.rad-card:hover,.rad-card:focus{background:#004a7c;border-color:#ff0;outline:none}
.rad-card .rk{font-family:Consolas,monospace;font-size:11.5px;color:#0ff;font-weight:bold;line-height:1.1;white-space:nowrap}
.rad-card .rc{font-size:16px;color:#ff5;font-weight:bold;line-height:1.2;margin:1px 0;white-space:nowrap}
.rad-card .rs{font-size:10px;color:#bbb;line-height:1.1;white-space:nowrap;overflow:hidden}
.rad-card.intro-card{flex-direction:row;gap:5px;padding:4px 5px;border-color:#ff5}
.rad-card.intro-card .rc{font-size:12px;color:#ff5;line-height:1.1}
.xz-glyph{font-size:26px;font-weight:bold;line-height:1.1}
.xz-key{font-family:Consolas,monospace;font-size:11px;font-weight:bold;margin-top:2px;padding:0 4px;background:#003b36;white-space:nowrap}

@media(max-width:480px){.dos-screen{transform:scale(.4)}}
@media(min-width:481px)and(max-width:768px){.dos-screen{transform:scale(.6)}}
</style>
</head>
<body>
<div class="dos-screen" id="dosScreen">
  <div class="dos-header">
    <div class="slop-logo" title="DAYI 經典標誌"><svg viewBox="0 0 120 40" width="95" height="30"><ellipse cx="60" cy="20" rx="55" ry="16" fill="none" stroke="#0ff" stroke-width="2"/><text x="50%" y="62%" text-anchor="middle" fill="#ff5555" font-size="18" font-weight="900" font-style="italic" font-family="Arial">DAYI</text></svg></div>
    <div class="title-group">
      <div class="magenta-double-line"></div>
      <div class="dos-main-title">快快快樂學大易</div>
      <div class="magenta-double-line"></div>
    </div>
  </div>

  <div class="dos-stage">
    <div class="sub-window" id="mainWin"></div>
  </div>

  <div class="dos-footer">
    <div style="display:flex;gap:10px;align-items:center">
      <button type="button" class="key-button" id="btnEscIdx" style="color:#800000" title="返回總目錄索引">Esc [索引]</button>
    </div>
    <div id="footerHint" style="font-size:12px;color:#333;flex:1;text-align:center">Esc 返回索引 ｜ ← → 切換上下頁 ｜ ↑ ↓ 捲動內文</div>
    <div style="display:flex;gap:8px;align-items:center">
      <button type="button" class="key-button" id="btnPrevPage">◀ 上一頁</button>
      <button type="button" class="key-button" id="btnNextPage">下一頁 ▶</button>
    </div>
  </div>
</div>

<script>
"use strict";
const C1="#0ff", C2="#5f5", C3="#ff80ab";

/* 全書 46 頁結構化教材資料 */
const PAGES = [
  { type:"intro" },

  /* ================= 第一行：數字鍵區（1 ～ 0，10 鍵） ================= */
  {
    key:"1", row:"第一行：數字鍵區", group:"人類", rad:"言", short1:"一", cat:"第 2 / 46 頁：數字鍵區（人類）",
    aux:[
      {g:"言訁", c:C1, title:"言與言字旁", desc:"言字、言字旁（如：計、話、語、請、謝）"},
      {g:"一碼一", c:C2, title:"一碼高頻字", desc:"單擊 1 加空格直接打出「一」"}
    ],
    slogan:`言字在 1 鍵 —— 數字鍵區第一鍵（<i class="ky">1</i>），一碼簡碼為「<b class="tr">一</b>」。`,
    rules:[
      `<b>所屬邏輯分類（人類）：</b>「言」象徵人類語言交流，獨立成字或作左側言字旁「訁」時一律取 <i class="ky">1</i>。`,
      `<b>依筆順取碼示範：</b>「話」先寫言字旁 <i class="ky">1</i>，再寫右半「舌」（撇 <i class="ky">/</i> ＋ 十 <i class="ky">S</i> ＋ 口 <i class="ky">O</i>），組為 <i class="cd">1/SO</i>。`
    ],
    examples:[
      ["言字旁",C1,"計","1S","左言字旁 (<i class=\"ky\">1</i>) ＋ 右十 (<i class=\"ky\">S</i>)。"],
      ["言字旁",C1,"話","1/SO","左言字旁 (<i class=\"ky\">1</i>) ＋ 右「舌」：撇 (<i class=\"ky\">/</i>) ＋ 十 (<i class=\"ky\">S</i>) ＋ 口 (<i class=\"ky\">O</i>)。"],
      ["言字旁",C1,"語","15O","左言字旁 (<i class=\"ky\">1</i>) ＋ 右「吾」：五 (<i class=\"ky\">5</i>) ＋ 口 (<i class=\"ky\">O</i>)。"],
      ["言字旁",C1,"請","15J","左言字旁 (<i class=\"ky\">1</i>) ＋ 右「青」：青字頭 (<i class=\"ky\">5</i>) ＋ 月 (<i class=\"ky\">J</i>)。"],
      ["言字旁",C1,"謝","1PG.","左言字旁 (<i class=\"ky\">1</i>) ＋ 中身 (<i class=\"ky\">P</i>) ＋ 右「寸」：十鉤 (<i class=\"ky\">G</i>) ＋ 點 (<i class=\"ky\">.</i>)。"],
      ["言字底",C1,"譽","W8E1","上臼框 (<i class=\"ky\">W</i>) ＋ 中八 (<i class=\"ky\">8</i>) ＋ 一 (<i class=\"ky\">E</i>) ＋ 下言 (<i class=\"ky\">1</i>)。"]
    ],
    poem:`言（<i class="ky">1</i> 鍵）`
  },
  {
    key:"2", row:"第一行：數字鍵區", group:"動物類", rad:"牛", short1:"二", cat:"第 3 / 46 頁：數字鍵區（動物類）",
    aux:[
      {g:"牛牜", c:C1, title:"牛與牛字旁", desc:"牛字、左側牛字旁（如：物、特、牧、件）"},
      {g:"羊⺶", c:C2, title:"羊與羊字頭", desc:"羊字、羊字頭（如：美、鮮、樣、義上）"}
    ],
    slogan:`２牛（牛羊同鍵） —— 數字鍵區第二鍵（<i class="ky">2</i>），一碼簡碼為「<b class="tr">二</b>」。`,
    rules:[
      `<b>牛羊同屬溫馴家畜：</b>大易將「牛、牜」與「羊、⺶」同歸入 <i class="ky">2</i> 鍵。`,
      `<b>實戰拆碼要訣：</b>「樣」左木 (<i class="ky">I</i>) ＋ 右上羊頭 (<i class="ky">2</i>) ＋ 右下「永」取首尾，標準大易三碼為 <i class="cd">I2.X</i>（亦簡作 <i class="cd">I2X</i>）。`
    ],
    examples:[
      ["牛字旁",C1,"物","20//","左牛字旁 (<i class=\"ky\">2</i>) ＋ 右「勿」：勹 (<i class=\"ky\">0</i>) ＋ 撇 (<i class=\"ky\">/</i>) ＋ 撇 (<i class=\"ky\">/</i>)。"],
      ["牛字旁",C1,"特","2FG.","左牛字旁 (<i class=\"ky\">2</i>) ＋ 右「寺」：土 (<i class=\"ky\">F</i>) ＋ 寸 (<i class=\"cd\">G.</i>)。"],
      ["羊字頭",C2,"美","2V","上羊字頭 (<i class=\"ky\">2</i>) ＋ 下大 (<i class=\"ky\">V</i>)。"],
      ["羊字旁",C2,"鮮",";2","左魚 (<i class=\"ky\">;</i>) ＋ 右羊 (<i class=\"ky\">2</i>)。"],
      ["羊字頭",C2,"樣","I2.X","左木 (<i class=\"ky\">I</i>) ＋ 右上羊頭 (<i class=\"ky\">2</i>) ＋ 右下「永」點 (<i class=\"ky\">.</i>) ＋ 水 (<i class=\"ky\">X</i>)。"],
      ["羊字旁",C2,"群","K2","左尹 (<i class=\"ky\">K</i>) ＋ 右羊 (<i class=\"ky\">2</i>)。"]
    ],
    poem:`２牛（<i class="ky">2</i> 鍵）`
  },
  {
    key:"3", row:"第一行：數字鍵區", group:"人類", rad:"目", short1:"三", cat:"第 4 / 46 頁：數字鍵區（人類）",
    aux:[
      {g:"目", c:C1, title:"目字部件", desc:"目字旁、目字底（如：見、相、看底、眼）"},
      {g:"且", c:C2, title:"且字部件", desc:"且字（如：助、祖、姐、組右）"},
      {g:"具頭", c:C3, title:"具字上框", desc:"目多一橫之變體（如：具、真、直上框）"}
    ],
    slogan:`３目（眼睛像數字 3 橫格） —— 數字鍵區第三鍵（<i class="ky">3</i>），一碼簡碼為「<b class="tr">三</b>」。`,
    rules:[
      `<b>眼睛構造聯想：</b>「目、且、具字上框」內部都有三格橫線，形似數字 <i class="ky">3</i>，統一歸入 <i class="ky">3</i> 鍵。`,
      `<b>最多四碼「一二三末」：</b>「縣」由左上目框 (<i class="ky">3</i>)、左下糸 (<i class="ky">T</i>)、右上小 (<i class="ky\">T</i>)、右下糸 (<i class="ky\">T</i>) 組成，取一二三末為 <i class="cd">3TTT</i>。`
    ],
    examples:[
      ["目字頭",C1,"見","30","上目 (<i class=\"ky\">3</i>) ＋ 下儿 (<i class=\"ky\">0</i>)。"],
      ["具字框",C3,"具","38","上具字框 (<i class=\"ky\">3</i>) ＋ 下八 (<i class=\"ky\">8</i>)。"],
      ["一二三末",C1,"縣","3TTT","左上目框 (<i class=\"ky\">3</i>) ＋ 左下糸 (<i class=\"ky\">T</i>) ＋ 右上小 (<i class=\"ky\">T</i>) ＋ 右下糸 (<i class=\"ky\">T</i>)。"],
      ["目字旁",C1,"相","I3","左木 (<i class=\"ky\">I</i>) ＋ 右目 (<i class=\"ky\">3</i>)。"],
      ["且字旁",C2,"助","3,","左且 (<i class=\"ky\">3</i>) ＋ 右力 (<i class=\"ky\">,</i>)。"],
      ["目字底",C1,"算","U3U","上草 (<i class=\"ky\">U</i>) ＋ 中目 (<i class=\"ky\">3</i>) ＋ 下廾 (<i class=\"ky\">U</i>)。"]
    ],
    poem:`３目（<i class="ky">3</i> 鍵）`
  },
  {
    key:"4", row:"第一行：數字鍵區", group:"工藝及其他", rad:"四", short1:"四", cat:"第 5 / 46 頁：數字鍵區（工藝及其他）",
    aux:[
      {g:"四罒", c:C1, title:"四與網字頭", desc:"四字、扁四網字頭（如：羅、罪、置、買上）"},
      {g:"黑", c:C2, title:"黑字部件", desc:"黑字及黑字旁（如：墨、默、點左）"},
      {g:"西覀", c:C3, title:"西與西字頭", desc:"西字、扁西頭（如：要、票、覆、栗）"}
    ],
    slogan:`黑西四（4） —— 數字鍵區第四鍵（<i class="ky">4</i>），一碼簡碼為「<b class="tr">四</b>」。`,
    rules:[
      `<b>四大字根同鍵：</b>口訣「黑西四」直接點出 <i class="ky">4</i> 鍵的三大核心字根：「黑」、「西（覀）」、「四（罒）」。`,
      `<b>實戰校訂範例：</b>「默」拆為左黑 (<i class="ky">4</i>) ＋ 右「犬」（大 <i class="ky">V</i> ＋ 點 <i class="ky">.</i>）＝ <i class="cd">4V.</i>；「羅」拆為上四字頭 (<i class="ky">4</i>) ＋ 左下糸 (<i class="ky">T</i>) ＋ 右下「隹」首碼 (<i class="ky">A</i>) ＋ 末碼 (<i class="ky">3</i>) ＝ <i class="cd">4TA3</i>。`
    ],
    examples:[
      ["西字頭",C3,"要","4L","上西字頭 (<i class=\"ky\">4</i>) ＋ 下女 (<i class=\"ky\">L</i>)。"],
      ["西字頭",C3,"票","4ET","上西字頭 (<i class=\"ky\">4</i>) ＋ 中一 (<i class=\"ky\">E</i>) ＋ 下小 (<i class=\"ky\">T</i>)。"],
      ["四字頭",C1,"羅","4TA3","上四字頭 (<i class=\"ky\">4</i>) ＋ 左下糸 (<i class=\"ky\">T</i>) ＋ 右下「隹」首碼 (<i class=\"ky\">A</i>) ＋ 末碼 (<i class=\"ky\">3</i>)。"],
      ["黑字頭",C2,"墨","4F","上黑 (<i class=\"ky\">4</i>) ＋ 下土 (<i class=\"ky\">F</i>)。"],
      ["黑字旁",C2,"默","4V.","左黑 (<i class=\"ky\">4</i>) ＋ 右「犬」（大 <i class=\"ky\">V</i> ＋ 末點 <i class=\"ky\">.</i>）。"],
      ["四字中",C1,"漫","XD4X","左氵 (<i class=\"ky\">X</i>) ＋ 右上日 (<i class=\"ky\">D</i>) ＋ 右中四 (<i class=\"ky\">4</i>) ＋ 右下又 (<i class=\"ky\">X</i>)。"]
    ],
    poem:`黑西四（<i class="ky">4</i> 鍵）`
  },
  {
    key:"5", row:"第一行：數字鍵區", group:"工藝及其他", rad:"王", short1:"五", cat:"第 6 / 46 頁：數字鍵區（工藝及其他）",
    aux:[
      {g:"王玉", c:C1, title:"王與斜玉旁", desc:"王字、斜玉旁（如：理、現、珍、球）"},
      {g:"壬", c:C2, title:"壬字部件", desc:"撇橫土「壬」（如：任、廷、賃、年下）"},

/* 狀態與導航控制（curPage = -1 為總目錄索引；0..45 為第 1..46 頁） */
let curPage = -1;

function goPage(idx){
  curPage = idx;
  const win = document.getElementById("mainWin");
  const btnEsc = document.getElementById("btnEscIdx");
  const btnPrev = document.getElementById("btnPrevPage");
  const btnNext = document.getElementById("btnNextPage");
  const hint = document.getElementById("footerHint");

  if(curPage === -1){
    win.innerHTML = renderIndexHTML();
    btnEsc.textContent = "Esc [目錄]";
    btnPrev.textContent = "◀ 總結";
    btnNext.textContent = "開始閱讀 ▶";
    hint.textContent = "點擊字根卡片或按鍵盤對應鍵跳轉 ｜ 按 Enter / → 從第 1 頁引言開始閱讀";
  } else {
    const p = PAGES[curPage];
    if(p.type === "intro") win.innerHTML = renderIntroHTML();
    else if(p.type === "special_rules") win.innerHTML = renderSpecialRulesHTML();
    else if(p.type === "confusing_5") win.innerHTML = renderConfusing5HTML();
    else if(p.type === "phrases") win.innerHTML = renderPhrasesHTML();
    else if(p.type === "roadmap_5day") win.innerHTML = renderRoadmapHTML();
    else if(p.type === "summary") win.innerHTML = renderSummaryHTML();
    else win.innerHTML = renderRadicalHTML(p);

    btnEsc.textContent = "Esc [索引]";
    btnPrev.textContent = curPage === 0 ? "◀ 返回索引" : "◀ 上一頁";
    btnNext.textContent = curPage === PAGES.length - 1 ? "返回索引 ▶" : "下一頁 ▶";
    hint.textContent = `第 ${curPage + 1} / ${PAGES.length} 頁 ｜ Esc 返回索引 ｜ ← → 切換上下頁 ｜ ↑ ↓ 捲動內文`;
  }
}

function prevPage(){
  if(curPage === -1) goPage(PAGES.length - 1);
  else if(curPage === 0) goPage(-1);
  else goPage(curPage - 1);
}

function nextPage(){
  if(curPage === -1) goPage(0);
  else if(curPage >= PAGES.length - 1) goPage(-1);
  else goPage(curPage + 1);
}

document.getElementById("btnEscIdx").addEventListener("click", () => {
  goPage(-1);
});
document.getElementById("btnPrevPage").addEventListener("click", prevPage);
document.getElementById("btnNextPage").addEventListener("click", nextPage);

/* 通用捲動輔助 */
function getActiveScrollBox(){
  const el = document.querySelector("#tutPageContent, .tut-content");
  return (el && el.offsetParent !== null) ? el : null;
}
function scrollActiveBox(deltaY){
  const box = getActiveScrollBox();
  if(!box) return false;
  box.scrollBy({ top: deltaY, behavior: "smooth" });
  return true;
}
window.addEventListener("wheel", e => {
  const box = getActiveScrollBox();
  if(box && !box.contains(e.target)) box.scrollTop += e.deltaY;
}, { passive: true });

/* 鍵盤控制（支援在索引頁直接按 40 個字根鍵跳轉） */
window.addEventListener("keydown", e => {
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.key === "Escape"){
    e.preventDefault();
    goPage(-1);
  } else if(e.key === "ArrowRight" || e.key === "Enter" || e.key === "PageDown"){
    e.preventDefault();
    nextPage();
  } else if(e.key === "ArrowLeft" || e.key === "PageUp"){
    e.preventDefault();
    prevPage();
  } else if(e.key === "ArrowUp"){
    if(scrollActiveBox(-95)) e.preventDefault();
  } else if(e.key === "ArrowDown"){
    if(scrollActiveBox(95)) e.preventDefault();
  } else if(curPage === -1 && e.key.length === 1){
    const k = e.key.toUpperCase();
    const idx = PAGES.findIndex(p => p.key === k);
    if(idx !== -1){
      e.preventDefault();
      goPage(idx);
    }
  }
});

/* 畫面自適應縮放 */
function scaleScreen(){
  const el = document.getElementById("dosScreen");
  if(!el) return;
  const W = window.innerWidth, H = window.innerHeight;
  const sc = Math.min((W - 12) / 960, (H - 12) / 540);
  el.style.transform = `scale(${Math.max(0.25, sc).toFixed(4)})`;
}
window.addEventListener("resize", scaleScreen);
scaleScreen();

/* 預設啟動顯示總目錄索引頁 */
goPage(-1);
</script>
