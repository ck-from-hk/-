<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>快快快樂學行列 - 行列 30 雙位數座標與 Windows 實戰指南（全書 36 頁互動版）</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none;margin:0;background:#0a1212;width:100vw;height:100vh;height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;font-family:"BiauKaiHK","DFKai-SB","標楷體","Microsoft JhengHei",serif;overflow:hidden}
.dos-screen{width:960px;height:540px;background:#002b2b;position:relative;border:3px solid #00aaaa;box-shadow:0 0 28px rgba(0,0,0,.95);display:flex;flex-direction:column;justify-content:space-between;transform-origin:center;flex-shrink:0}
.dos-header{height:48px;background:#003d3d;border-bottom:2px solid #00ffff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;flex-shrink:0}
.eten-logo{display:flex;align-items:center;justify-content:center;width:102px;height:30px}
.title-group{display:flex;align-items:center;flex:1;justify-content:center;gap:14px}
.eten-double-line{flex:1;height:8px;border-top:3px solid #ffaa00;border-bottom:3px solid #00ffff}
.dos-main-title{color:#ffff55;font-size:29px;font-weight:bold;letter-spacing:6px;text-shadow:2px 2px #000;white-space:nowrap;padding:0 10px}
.dos-stage{flex:1;position:relative;display:flex;justify-content:center;align-items:center;padding:7px 18px;overflow:hidden}
.dos-footer{height:36px;background:#c0c0c0;border-top:2px solid #fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0;z-index:10}
.key-button{background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;font-weight:bold;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:#000080;cursor:pointer;font-family:Consolas,"Microsoft JhengHei",monospace;padding:0 12px;text-decoration:none}
.key-button:active{border-color:#404040 #fff #fff #404040;background:#a8a8a8}

.sub-window{background:#001515;border:3px double #00ffff;width:100%;height:100%;padding:10px 18px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:6px 6px 0 rgba(0,0,0,.6);z-index:10}
.sub-win-title{color:#ffff55;font-size:19px;font-weight:bold;border-bottom:2px solid #00ffff;padding-bottom:5px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.category-badge{background:#003333;border:1px solid #00ffff;color:#ffff55;font-size:12.5px;padding:2px 9px;margin-left:8px}

/* 教學內容區（彈性鋪滿整頁，放大字級且免捲動） */
.tut-content{overflow-y:auto;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between;gap:4px;font-size:14px;color:#e0ffff;line-height:1.55;margin:4px 0 2px;padding-right:4px;overscroll-behavior:contain;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.tut-h{font-weight:bold;font-size:14.5px;margin-top:0;background:rgba(0,170,170,.22);padding:2px 8px;border-left:4px solid;flex-shrink:0}
.tut-h.y{color:#ffff55;border-color:#ffff55}.tut-h.g{color:#55ff55;border-color:#55ff55}.tut-h.o{color:#ffaa00;border-color:#ffaa00}.tut-h.c{color:#00ffff;border-color:#00ffff}
.tut-content i{font-style:normal;font-weight:bold}
.tut-content .tr{color:#ffff55}.tut-content .ky{color:#00ffff}.tut-content .cd{color:#ffaa00}.tut-content .c-coord{color:#55ff55;font-family:Consolas,monospace}

/* 主字根＋放大彩色輔助字形展示區 */
.rad-hero-box{display:flex;align-items:stretch;background:rgba(0,0,0,.5);border:2px solid #ffaa00;padding:5px 10px;gap:12px;margin:0;border-radius:4px;flex-shrink:0}
.rad-main-card{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#002222;border:2px solid #ffff55;padding:4px 10px;min-width:90px;box-shadow:inset 2px 2px 5px rgba(0,0,0,.85);flex-shrink:0}
.rad-big-char{font-size:40px;color:#ffff55;line-height:1.05;font-weight:bold;text-shadow:2px 2px #000}
.rad-key-tag{font-size:11.5px;color:#00ffff;font-weight:bold;margin-top:3px;font-family:Consolas,monospace;background:#003333;padding:1px 6px;border:1px solid #00ffff;white-space:nowrap}

.rad-right-panel{display:flex;flex-direction:column;justify-content:space-between;flex:1;gap:4px}
.aux-showcase-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.aux-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(0,43,43,.92);border:1px solid #00ffff;padding:3px 8px;border-radius:3px}
.aux-glyph{font-size:20px;font-weight:bold;line-height:1;text-shadow:1px 1px #000}
.aux-desc{font-size:12px;color:#ccffff;line-height:1.25}
.aux-desc b{display:block;font-size:12.5px}

/* 一行兩字雙欄範例網格（自動撐滿剩餘版面高度） */
.ex-grid-2col{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:5px;margin-top:0}
.ex-card{display:flex;align-items:center;gap:6px;background:rgba(0,25,25,.88);border:1px solid #009999;padding:4px 8px;border-radius:3px;font-size:12.8px;line-height:1.3}
.ex-char{font-size:20px;font-weight:bold;min-width:24px;text-align:center;flex-shrink:0}
.ex-code{font-family:Consolas,monospace;font-size:13px;color:#ffff55;font-weight:bold;background:#000;border:1px solid #55ff55;padding:2px 6px;border-radius:2px;white-space:nowrap;flex-shrink:0}
.ex-note{color:#e0ffff;flex:1;text-align:left}
.ex-note b{color:#ffaa00}

/* 範例表格 */
.retro-table{width:100%;border-collapse:collapse;color:#fff;font-size:13.5px;margin-top:0}
.retro-table th,.retro-table td{border:1px solid #00ffff;padding:3px 6px;text-align:center}
.retro-table th{background:#003333;color:#ffff55}
.retro-table td:nth-child(3){font-family:Consolas,monospace;color:#55ff55;font-weight:bold;white-space:nowrap}

/* 進階補充卡 */
.adv-aux-box{background:rgba(0,40,40,.65);border:1px dashed #00ffff;padding:6px 10px;margin-top:0;border-radius:3px;font-size:13px;line-height:1.5;color:#ccffff}

/* 頁腳口訣樣式 */
.poem-in-footer { color: #222; font-size: 13.5px; font-weight: bold; }
.poem-in-footer b[style*="#ffaa00"] { color: #b34700 !important; }
.poem-in-footer b[style*="#55ff55"] { color: #006600 !important; }
.poem-in-footer .ky { color: #0000bb !important; font-style: normal; }
.poem-in-footer .poem-title { color: #800000; margin-right: 6px; }

/* 索引頁矩陣佈局 (上方 3行 × 10鍵精準對齊矩陣 + 底部單行專題區) */
.idx-board{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between;gap:10px;padding:3px 0;overflow:hidden}
.matrix-area{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between;gap:14px}
.col-header-row{display:flex;align-items:stretch;gap:6px;flex-shrink:0;margin-bottom:-6px}
.row-spacer{width:42px;flex-shrink:0}
.col-headers{flex:1;min-width:0;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;text-align:center;font-size:13px;font-weight:bold;color:#ffaa00;background:rgba(0,0,0,.45);padding:4px 0;border-top:1.5px solid #007777;border-bottom:1.5px solid #007777}
.col-headers span{white-space:nowrap;overflow:hidden}
.rad-row{flex:1;min-height:0;display:flex;align-items:stretch;gap:6px}
.row-label{width:42px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:bold;line-height:1.25;text-align:center;background:rgba(0,0,0,.35);border:1px solid #005555;border-radius:2px;white-space:nowrap}
.rad-grid-10{flex:1;min-width:0;min-height:0;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.rad-card{background:#001a1a;border:1.5px solid #00aaaa;padding:3px 1px;text-align:center;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .12s;cursor:pointer;min-height:0;min-width:0;overflow:hidden;width:100%}
.rad-card:hover,.rad-card:focus{background:#004040;border-color:#ffff55;outline:none}
.rad-card .rk{font-family:Consolas,monospace;font-size:14px;color:#55ff55;font-weight:bold;line-height:1.1;white-space:nowrap}
.rad-card .rc{font-size:23px;color:#ffff55;font-weight:bold;line-height:1.15;margin:2px 0;white-space:nowrap}
.rad-card .rs{font-size:11.5px;color:#00ffff;line-height:1.1;white-space:nowrap;overflow:hidden}
.bottom-nav-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;flex-shrink:0;padding-top:5px;border-top:1px dashed #007777}
.rad-card.intro-card{flex-direction:row;justify-content:center;gap:6px;padding:6px 6px;border-color:#ffff55;background:#1a0000}
.rad-card.intro-card:hover{background:#3a0000;border-color:#00ffff}
.rad-card.intro-card .rk{font-size:12.5px;color:#ffaa00}
.rad-card.intro-card .rc{font-size:15px;color:#ffff55;margin:0;letter-spacing:1px}

@media(max-width:480px){.dos-screen{transform:scale(.4)}}
@media(min-width:481px)and(max-width:768px){.dos-screen{transform:scale(.6)}}
</style>
</head>
<body>
<div class="dos-screen" id="dosScreen">
  <div class="dos-header">
    <div class="eten-logo" title="ETen 倚天經典標誌"><svg viewBox="0 0 120 40" width="98" height="30"><rect x="4" y="4" width="112" height="32" rx="4" fill="#001a1a" stroke="#00ffff" stroke-width="2"/><text x="50%" y="65%" text-anchor="middle" fill="#ffaa00" font-size="16" font-weight="900" font-family="Consolas,Arial">ARRAY 30</text></svg></div>
    <div class="title-group">
      <div class="eten-double-line"></div>
      <div class="dos-main-title">快快快樂學行列</div>
      <div class="eten-double-line"></div>
    </div>
  </div>

  <div class="dos-stage">
    <div class="sub-window" id="mainWin"></div>
  </div>

  <div class="dos-footer">
    <div style="display:flex;gap:10px;align-items:center">
      <button type="button" class="key-button" id="btnEscIdx" style="color:#800000" title="返回總目錄索引">Esc [索引]</button>
    </div>
    <div id="footerHint" style="font-size:12px;color:#333;flex:1;text-align:center">Esc 返回索引 ｜ ← → 切換上下頁 ｜ 點擊卡片或直接按鍵盤字根鍵跳轉</div>
    <div style="display:flex;gap:8px;align-items:center">
      <button type="button" class="key-button" id="btnPrevPage">◀ 上一頁</button>
      <button type="button" class="key-button" id="btnNextPage">下一頁 ▶</button>
    </div>
  </div>
</div>

<script>
"use strict";
const C1="#00ffff", C2="#55ff55", C3="#ffaa00";

/* 全書 36 頁結構化教材資料（0=引言, 1..30=行列30鍵雙位數座標專講, 31..35=五大實戰專題） */
const PAGES = [
  { type:"intro" },

  /* ================= 第一列：上排字母鍵區（Q ～ P，尾筆為 1～4，共 10 鍵） ================= */
  {
    key:"Q", coord:"1^ (11~14)", rad:"土", short1:"的", cat:"第 2 / 36 頁：上排字母區（直行 1 橫）",
    aux:[
      {g:"土士王工", c:C1, title:"座標 [11] 首1尾1", desc:"土、士、王、工、五、正（首橫底橫）"},
      {g:"寸扌龺", c:C2, title:"座標 [14] 首1尾4", desc:"寸、提手旁扌、青字頭龺（橫交豎）"}
    ],
    slogan:`首筆 1（橫）、尾筆 1 或 4（橫/正交） → 座標 <i class="c-coord">11~14</i> 落在上排 <i class="ky">Q</i> 鍵。`,
    rules:[
      `<b>座標推導公式：</b>「土、王、工」首筆橫(<i class="cd">1</i>)、尾筆橫(<i class="cd">1</i>)＝<i class="c-coord">11</i>；「寸、扌」首筆橫(<i class="cd">1</i>)、尾筆正交(<i class="cd">4</i>)＝<i class="c-coord">14</i>，全歸上排 <i class="ky">Q</i>。`,
      `<b>一級簡碼字：</b>單擊 <i class="ky">Q</i> ＋ 空白鍵直接打出最高頻字「<b class="tr">的</b>」。`
    ],
    examples:[
      ["",C1,"地","QB","左土 <b>Q[11]</b> ＋ 右也 <b>B[52]</b>。"],
      ["",C2,"打","QA","左扌 <b>Q[14]</b> ＋ 右丁 <b>A[1-]</b>。"],
      ["",C1,"理","QPQ","左王 <b>Q[11]</b> ＋ 右里（田 <b>P</b> ＋ 土 <b>Q</b>）。"],
      ["",C2,"青","QM","上青字頭 <b>Q[14]</b> ＋ 下月 <b>M[7v]</b>。"],
      ["",C2,"時","UQQ","左日 <b>U[7^]</b> ＋ 右寺（土 <b>Q</b> ＋ 寸 <b>Q</b>）。"],
      ["",C1,"堂","CJ;Q","尚頭 <b>C</b> ＋ 冖 <b>J</b> ＋ 口 <b>;</b> ＋ 尾碼土 <b>Q[11]</b>。"]
    ],
    poem:`首 <b style="color:${C3}">1</b> 橫起尾 <b style="color:${C2}">1、4</b>，土王工寸扌歸 <i class="ky">Q [1^]</i>`
  },
  {
    key:"W", coord:"2^ (21~22)", rad:"女", short1:"一/標點", cat:"第 3 / 36 頁：上排字母區（直行 2 逆彎）",
    aux:[
      {g:"女彑", c:C1, title:"座標 [21] 首2尾1", desc:"女字旁、互字頭彑（逆彎起筆、橫收尾）"},
      {g:"巛", c:C2, title:"座標 [22] 並排逆彎", desc:"三拐川「巛」（如：巡、災上、腦右上）"}
    ],
    slogan:`首筆 2（逆彎）、尾筆 1 或 2（橫/逆彎） → 座標 <i class="c-coord">21~22</i> 落在上排 <i class="ky">W</i> 鍵。`,
    rules:[
      `<b>座標推導公式：</b>「女」第一筆撇點屬逆彎(<i class="cd">2</i>)、最後一筆長橫(<i class="cd">1</i>)，組合為 <i class="c-coord">21</i>，故在 <i class="ky">W</i> 鍵。`,
      `<b>Windows 專屬功能：</b>在 Windows 版中，先按 <i class="ky">W</i> 再按數字鍵 <i class="cd">1~0</i> 可快速輸入全形標點符號。`
    ],
    examples:[
      ["",C1,"好","WB","左女 <b>W[21]</b> ＋ 右子 <b>B[5v]</b>。"],
      ["",C1,"如","W;","左女 <b>W[21]</b> ＋ 右口 <b>;[0-]</b>。"],
      ["",C1,"媽","WU","左女 <b>W[21]</b> ＋ 右馬 <b>U[7^]</b>。"],
      ["",C1,"姐","W/","左女 <b>W[21]</b> ＋ 右且 <b>/[0v]</b>。"],
      ["",C2,"巡","WX","先寫內部巛 <b>W[22]</b> ＋ 後寫外圍辶 <b>X[2v]</b>。"],
      ["",C1,"安","JW","上宀 <b>J[7-]</b> ＋ 尾碼女 <b>W[21]</b>。"]
    ],
    poem:`首 <b style="color:${C3}">2</b> 逆彎尾 <b style="color:${C2}">1、2</b>，女彑三拐巛入 <i class="ky">W [2^]</i>`
  },
  {
    key:"E", coord:"3^ (31~34)", rad:"門", short1:"上", cat:"第 4 / 36 頁：上排字母區（直行 3 直豎）",
    aux:[
      {g:"止上非", c:C1, title:"座標 [31] 首3尾1", desc:"止、上、非（直豎起筆、底橫收尾）"},
      {g:"門鬥", c:C2, title:"座標 [31/34] 雙豎框", desc:"門字框、鬥字框（兩側直豎對稱展開）"}
    ],
    slogan:`首筆 3（直豎）、尾筆 1 或 4（橫/正交） → 座標 <i class="c-coord">31~34</i> 落在上排 <i class="ky">E</i> 鍵。`,
    rules:[
      `<b>座標推導公式：</b>「止、上」首筆直豎(<i class="cd">3</i>)、底筆長橫(<i class="cd">1</i>)＝<i class="c-coord">31</i>；雙豎外框「門、鬥」亦整體歸入 <i class="ky">E</i> 鍵。`,
      `<b>一級簡碼字：</b>單擊 <i class="ky">E</i> ＋ 空白鍵直接打出「<b class="tr">上</b>」。`
    ],
    examples:[
      ["",C2,"間","EU","外門 <b>E[3^]</b> ＋ 內日 <b>U[7^]</b>。"],
      ["",C2,"開","EAF","外門 <b>E[3^]</b> ＋ 內一 <b>A</b> ＋ 廾 <b>F</b>。"],
      ["",C1,"步","EC","上止 <b>E[31]</b> ＋ 下少 <b>C[3v]</b>。"],
      ["",C1,"肯","EM","上止 <b>E[31]</b> ＋ 下月 <b>M[7v]</b>。"],
      ["",C1,"悲","EN","上非 <b>E[31]</b> ＋ 下心 <b>N[6v]</b>。"],
      ["",C1,"正","AE","上一 <b>A[1-]</b> ＋ 尾碼止 <b>E[31]</b>。"]
    ],
    poem:`首 <b style="color:${C3}">3</b> 直豎尾 <b style="color:${C2}">1、4</b>，止上非門鬥歸 <i class="ky">E [3^]</i>`
  },
  {
    key:"R", coord:"4^ (41~44)", rad:"艹", short1:"不", cat:"第 5 / 36 頁：上排字母區（直行 4 正交）",
    aux:[
      {g:"艹革", c:C1, title:"座標 [44] 雙十正交", desc:"草字頭艹、革字旁（雙十字正交結構）"},
      {g:"甘共", c:C2, title:"座標 [41] 首4尾1", desc:"甘字、共字上廿（正交起筆、底橫封口）"}
    ],
    slogan:`首筆 4（正交）、尾筆 1 或 4（橫/正交） → 座標 <i class="c-coord">41~44</i> 落在上排 <i class="ky">R</i> 鍵。`,
    rules:[
      `<b>座標推導公式：</b>草字頭「艹」由兩個十字正交(<i class="cd">4</i>)組成，座標為 <i class="c-coord">44</i>；「甘」首筆正交(<i class="cd">4</i>)、底橫(<i class="cd">1</i>)＝<i class="c-coord">41</i>，皆在 <i class="ky">R</i> 鍵。`,
      `<b>一級簡碼字：</b>單擊 <i class="ky">R</i> ＋ 空白鍵直接打出「<b class="tr">不</b>」。`
    ],
    examples:[
      ["",C1,"花","RKS","上艹 <b>R[44]</b> ＋ 下化（亻 <b>K</b> ＋ 匕 <b>S</b>）。"],
      ["",C1,"草","RUF","上艹 <b>R[44]</b> ＋ 中日 <b>U</b> ＋ 下十 <b>F</b>。"],
      ["",C1,"苦","RZ","上艹 <b>R[44]</b> ＋ 下古 <b>Z[10]</b>（或 RF;）。"],
      ["",C2,"某","RZ","上甘 <b>R[41]</b> ＋ 下木 <b>Z[18]</b>。"],
      ["",C1,"鞋","RQQ","左革 <b>R[44]</b> ＋ 右圭（土 <b>Q</b> ＋ 土 <b>Q</b>）。"],
      ["",C2,"甜","O;R","左舌（千 <b>O</b> ＋ 口 <b>;</b>）＋ 尾碼甘 <b>R[41]</b>。"]
    ],
    poem:`首 <b style="color:${C3}">4</b> 正交尾 <b style="color:${C2}">1、4</b>，草頭甘革全在 <i class="ky">R [4^]</i>`
  },
  {
    key:"T", coord:"5^ (51~59)", rad:"刀", short1:"女/了", cat:"第 6 / 36 頁：上排字母區（直行 5 順彎）",
    aux:[
      {g:"艮聿", c:C1, title:"座標 [51] 首5尾1", desc:"艮字（眼/銀右旁）、聿字（筆畫字根）"},

/* 渲染索引總目錄頁（curPage = -1）：嚴格 3 行 × 10 鍵對齊矩陣 + 底部 6 專題卡 */
function renderIndexHTML(){
  const row1 = PAGES.slice(1, 11);   // Q..P (1^..0^)
  const row2 = PAGES.slice(11, 21);  // A..; (1-..0-)
  const row3 = PAGES.slice(21, 31);  // Z../ (1v..0v)

  const buildRow = (arr, startIdx) => arr.map((p, i) => {
    const safeTitle = (p.slogan || "").replace(/<[^>]+>/g, "").replace(/"/g, "&quot;");
    return `
      <div class="rad-card" onclick="goPage(${startIdx + i})" title="${p.key} 鍵 ${p.coord}：${safeTitle}">
        <span class="rk">${p.key}</span>
        <span class="rc">${p.rad}</span>
        <span class="rs">[${p.short1}]</span>
      </div>
    `;
  }).join("");

  return `
    <div class="sub-win-title">
      <div><span>📖 快快快樂學行列 — 30 鍵雙位數座標總目錄</span><span class="category-badge">全書導航</span></div>
      <span style="font-size:12.5px;color:#00ffff">點擊字根卡片或直接按鍵盤對應字根鍵跳轉</span>
    </div>
    <div class="idx-board">
      <div class="matrix-area">
        <div class="col-header-row">
          <div class="row-spacer"></div>
          <div class="col-headers">
            <span>1 橫</span><span>2 逆彎</span><span>3 直</span><span>4 正交</span><span>5 順彎</span>
            <span>6 點</span><span>7 蓋</span><span>8 人八</span><span>9 撇</span><span>0 框</span>
          </div>
        </div>

        <div class="rad-row">
          <div class="row-label" style="color:#55ff55">上排<br>^ 1~4</div>
          <div class="rad-grid-10">${buildRow(row1, 1)}</div>
        </div>

        <div class="rad-row">
          <div class="row-label" style="color:#ffff55">中排<br>- 本/5</div>
          <div class="rad-grid-10">${buildRow(row2, 11)}</div>
        </div>

        <div class="rad-row">
          <div class="row-label" style="color:#ffaa00">下排<br>v 6~0</div>
          <div class="rad-grid-10">${buildRow(row3, 21)}</div>
        </div>
      </div>

      <div class="bottom-nav-grid">
        <div class="rad-card intro-card" onclick="goPage(0)"><span class="rk">P.01</span><span class="rc">引言座標</span></div>
        <div class="rad-card intro-card" onclick="goPage(31)"><span class="rk">P.32</span><span class="rc">取碼原則</span></div>
        <div class="rad-card intro-card" onclick="goPage(32)"><span class="rk">P.33</span><span class="rc">二級簡碼</span></div>
        <div class="rad-card intro-card" onclick="goPage(33)"><span class="rk">P.34</span><span class="rc">W鍵符號</span></div>
        <div class="rad-card intro-card" onclick="goPage(34)"><span class="rk">P.35</span><span class="rc">五日速成</span></div>
        <div class="rad-card intro-card" onclick="goPage(35)"><span class="rk">P.36</span><span class="rc">總結總表</span></div>
      </div>
    </div>
  `;

  curPage = idx;
  const win = document.getElementById("mainWin");
  const btnEsc = document.getElementById("btnEscIdx");
  const btnPrev = document.getElementById("btnPrevPage");
  const btnNext = document.getElementById("btnNextPage");
  const hint = document.getElementById("footerHint");
  if(!win) return;

  if(curPage === -1){
    win.innerHTML = renderIndexHTML();
    btnEsc.textContent = "Esc [目錄]";
    btnPrev.textContent = "◀ 總結";
    btnNext.textContent = "開始閱讀 ▶";
    hint.textContent = "點擊字根卡片或直接按鍵盤對應字根鍵跳轉 ｜ 按 Enter / → 從第 1 頁引言開始閱讀";
  } else {
    const p = PAGES[curPage];
    if(p.type === "intro") win.innerHTML = renderIntroHTML();
    else if(p.type === "special_rules") win.innerHTML = renderSpecialRulesHTML();
    else if(p.type === "windows_shortcodes") win.innerHTML = renderWindowsShortcodesHTML();
    else if(p.type === "w_symbols") win.innerHTML = renderWSymbolsHTML();
    else if(p.type === "roadmap_5day") win.innerHTML = renderRoadmapHTML();
    else if(p.type === "summary") win.innerHTML = renderSummaryHTML();
    else win.innerHTML = renderRadicalHTML(p);

    btnEsc.textContent = "Esc [索引]";
    btnPrev.textContent = curPage === 0 ? "◀ 返回索引" : "◀ 上一頁";
    btnNext.textContent = curPage === PAGES.length - 1 ? "返回索引 ▶" : "下一頁 ▶";
    
    if (p && p.poem) {
      hint.innerHTML = `<span class="poem-in-footer"><span class="poem-title">🎵 座標推導：</span>${p.poem}</span>`;
    } else {
      hint.textContent = `Esc 返回索引 ｜ ← → 切換上下頁`;
    }
  }
}

function prevPage(){
  if(curPage === -1) goPage(PAGES.length - 1);
  else if(curPage === 0) goPage(-1);
  else goPage(curPage - 1);
}

function nextPage(){
  if(curPage === -1) goPage(0);
  else if(curPage >= PAGES.length - 1) goPage(-1);
  else goPage(curPage + 1);
}

document.getElementById("btnEscIdx").addEventListener("click", () => {
  goPage(-1);
});
document.getElementById("btnPrevPage").addEventListener("click", prevPage);
document.getElementById("btnNextPage").addEventListener("click", nextPage);

/* 通用捲動輔助 */
function getActiveScrollBox(){
  const el = document.querySelector("#tutPageContent, .tut-content");
  return (el && el.offsetParent !== null) ? el : null;
}
function scrollActiveBox(deltaY){
  const box = getActiveScrollBox();
  if(!box) return false;
  box.scrollBy({ top: deltaY, behavior: "smooth" });
  return true;
}
window.addEventListener("wheel", e => {
  const box = getActiveScrollBox();
  if(box && !box.contains(e.target)) box.scrollTop += e.deltaY;
}, { passive: true });

/* 鍵盤控制（支援在索引頁直接按 30 個字根鍵跳轉） */
window.addEventListener("keydown", e => {
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.key === "Escape"){
    e.preventDefault();
    goPage(-1);
  } else if(e.key === "ArrowRight" || e.key === "Enter" || e.key === "PageDown"){
    e.preventDefault();
    nextPage();
  } else if(e.key === "ArrowLeft" || e.key === "PageUp"){
    e.preventDefault();
    prevPage();
  } else if(e.key === "ArrowUp"){
    if(scrollActiveBox(-95)) e.preventDefault();
  } else if(e.key === "ArrowDown"){
    if(scrollActiveBox(95)) e.preventDefault();
  } else if(curPage === -1 && e.key.length === 1){
    const k = e.key.toUpperCase();
    const idx = PAGES.findIndex(p => p.key === k);
    if(idx !== -1){
      e.preventDefault();
      goPage(idx);
    }
  }
});

/* 畫面自適應縮放 */
function scaleScreen(){
  const el = document.getElementById("dosScreen");
  if(!el) return;
  const W = window.innerWidth, H = window.innerHeight;
  const sc = Math.min((W - 12) / 960, (H - 12) / 540);
  el.style.transform = `scale(${Math.max(0.25, sc).toFixed(4)})`;
}
window.addEventListener("resize", scaleScreen);

window.onload = function(){
  scaleScreen();
  const initHash = location.hash.replace("#","").toUpperCase();
  const hashIdx = PAGES.findIndex(p => p.key === initHash);
  goPage(hashIdx !== -1 ? hashIdx : -1);
};
</script>
